<script>
const $=s=>document.querySelector(s),W=180,H=320,cv=$('#c'),g=cv.getContext('2d'),pad=n=>String(n).padStart(6,'0');
cv.width=W;cv.height=H;g.imageSmoothingEnabled=false;
const COL=['#4fd8ff','#ff7eb6','#ffd84a','#6ee06e','#b17cff','#ff9a4a'],SX=90,SY=284;
const mb=a=>()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};

const shade=(h,k)=>{const n=parseInt(h.slice(1),16);return'rgb('+[n>>16,n>>8&255,n&255].map(v=>Math.max(0,Math.min(255,v+k))).join()+')'};

 for(let j=0;j<s;j++)for(let i=0;i<s;i++){const dx=i+.5-r,dy=j+.5-r,d=Math.hypot(dx,dy);if(d>r)continue;
  x.fillStyle=shade(col,d>r-1.4?-75:dx+dy<-r*.55?45:dx+dy>r*.5?-30:0);x.fillRect(i,j,1,1)}
 x.fillStyle='#fff';x.fillRect(3,3,2,1);x.fillRect(3,4,1,1);

 return c}
