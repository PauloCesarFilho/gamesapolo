async function sendScore(name,sc,sh){
 const now=Date.now(),shName=SHIPS[sh].n;
 const l=loc();l.push({name,score:sc,ship:shName,t:now});l.sort((a,b)=>b.score-a.score);localStorage.sb_rank=JSON.stringify(l.slice(0,30));
 if(!ON)return;
 const r=await fetch(`${FB}/scores?key=${CFG.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({fields:{name:{stringValue:name},score:{integerValue:String(sc)},ship:{stringValue:shName},t:{integerValue:String(now)}}})});
 if(!r.ok)throw 0}

async function getTop(lim=150){
 if(!ON)return{list:loc(),local:1};
 try{const r=await fetch(`${FB}:runQuery?key=${CFG.apiKey}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({structuredQuery:{from:[{collectionId:'scores'}],orderBy:[{field:{fieldPath:'score'},direction:'DESCENDING'}],limit:lim}})});
  const j=await r.json(),seen={},list=[];
  j.filter(x=>x.document).forEach(x=>{const f=x.document.fields,n=f.name.stringValue,k=n.toUpperCase();if(!seen[k]){seen[k]=1;list.push({name:n,score:+f.score.integerValue,ship:f.ship?f.ship.stringValue:'BRASIL',t:f.t?+f.t.integerValue:0})}});

/* Gerador do Aviao Brilhante de Investida Lateral:
   A cada mapa fica mais rapido e adiciona +1 aviao (Stage 1 = 1, Stage 2 = 2 ... ate o limite de 5 por onda para dar para desviar) */
function spawnDashers(){
 const n=Math.min(5,stage);
 const trackDur=Math.max(.24,.52-(stage-1)*.035);
 const lockDur=Math.max(.20,.40-(stage-1)*.025);
 const dashSpd=Math.min(580,350+(stage-1)*26);
 const stepDelay=Math.max(.22,.36-(stage-1)*.015);
 const startSide=(dashCount%2==1)?(R()<.5?1:-1):(stage%2?1:-1);
 const offsets=[0,-22,22,-40,40];
 for(let i=0;i<n;i++){
  const sd=(i%2==0)?startSide:-startSide;
  const yo=offsets[i];
  const y0=clamp(p.y+yo,44,H-48);
  sq.push({
   e:E(8,11,sd>0?-10:W+10,y0,{
    side:sd,tx:sd>0?11:W-11,yOff:yo,st:0,
    trT:trackDur,lkT:lockDur,lkMax:lockDur,spd:dashSpd,
    da:sd>0?0:Math.PI,bpT:.04,dr:i==n-1&&R()<.25
   }),
   d:i*stepDelay
  });
 }
}

function mv(e,dt){const t=e.t;switch(e.mt){
 case 0:e.y+=e.vy*dt;e.x=e.x0+Math.sin(t*2+(e.ph||0))*e.amp;break;
 case 1:e.y+=(95+stage*6)*dt;e.x+=Math.sign(p.x-e.x)*30*dt;break;
 case 2:e.y+=(e.y<e.hy?45:8)*dt;e.x+=Math.sin(t*1.5)*22*dt;break;
 case 3:e.x+=e.dir*72*dt;e.y=e.y0+Math.sin(t*1.7)*34+t*14;e.an=Math.atan2(Math.cos(t*1.7)*58+14,e.dir*72)-Math.PI/2;break;
 case 4:e.y-=125*dt;e.x+=Math.sign(p.x-e.x)*18*dt;e.an=Math.PI;break;
 case 5:if(e.hd==null){e.hd=Math.PI/2;e.tn=0}if(e.y>e.ly&&e.tn<6.3){const w=2.7*e.dir*dt;e.hd+=w;e.tn+=Math.abs(w)}e.x+=Math.cos(e.hd)*105*dt;e.y+=Math.sin(e.hd)*105*dt;e.an=e.hd-Math.PI/2;break;
 case 6:e.y+=GS*dt*bgm;break;
 case 7:{
  const aimA=e.side>0?-Math.PI/2:Math.PI/2;
  e.an=aimA;
  if(e.st==0){
   e.x+=(e.tx-e.x)*Math.min(1,dt*6);
   const ty=clamp(p.y,44,H-46),dy=ty-e.y;
   e.y+=Math.sign(dy)*Math.min(Math.abs(dy),88*dt);
   if((Math.abs(dy)<5&&Math.abs(e.x-e.tx)<3)||e.t>2.2){e.st=1;e.sc=.28}
  }else if(e.st==1){
   e.sc-=dt;
   if(e.sc<=0&&!p.hide){
    e.sc=.38;e.shots--;
    const dirA=e.side>0?0:Math.PI;
    es(e.x+e.side*6,e.y,dirA,105+stage*4);
    snd(360,.04,'square',.02,180);
    if(e.shots<=0){e.st=2;e.sc=.35}
  }
  }else{
   e.sc-=dt;
   if(e.sc<=0){e.x-=e.side*95*dt;e.y-=45*dt}
  }
  break;
 }
 case 8:{
  e.an=0;
  if(e.st==0){
   e.y+=75*dt;
   if(e.y>=e.hy){e.st=1;e.sc=.3}
  }else if(e.st==1){
   e.sc-=dt;
   if(e.sc<=0&&!p.hide){
    e.sc=.45;e.shots--;
    es(e.x-3,e.y+6,Math.PI/2,95+stage*4);
    es(e.x+3,e.y+6,Math.PI/2,95+stage*4);
    if(e.shots<=0){e.st=2;e.dir=e.x<90?-1:1}
   }
  }else{
   e.x+=e.dir*80*dt;e.y-=55*dt;
  }
  break;
 }
 case 9:
  e.y+=25*dt;e.x=clamp(e.x0+Math.sin(t*1.4)*20,18,W-18);
  break;
 case 10:
  e.y+=(62+stage*3)*dt;e.x=clamp(e.x0+Math.sin(t*2.8+e.ph)*24,14,W-14);
  break;
 case 11:{
  if(e.st==0){
   e.x+=(e.tx-e.x)*Math.min(1,dt*14);
   const ty=clamp(p.y+(e.yOff||0),42,H-44),dy=ty-e.y;
   e.y+=Math.sign(dy)*Math.min(Math.abs(dy),220*dt);
   e.da=Math.atan2(p.y-e.y,p.x-e.x);
   e.an=e.da+Math.PI/2;
   e.bpT-=dt;
   if(e.bpT<=0){e.bpT=.13;snd(880,.04,'square',.035,1320)}
   if(R()<.5)fx.push({x:e.x+(R()-.5)*8,y:e.y+(R()-.5)*8,vx:0,vy:0,l:.2,c:'#ffd700'});
   e.trT-=dt;
   if(e.trT<=0){
    e.st=1;
    e.da=Math.atan2(p.y-e.y,p.x-e.x);
    e.an=e.da+Math.PI/2;
    snd(1150,.15,'sawtooth',.05,1650);
   }
  }else if(e.st==1){
   e.lkT-=dt;
   if(R()<.75){
    const a=R()*6.28;
    fx.push({x:e.x+Math.cos(a)*10,y:e.y+Math.sin(a)*10,vx:-Math.cos(a)*35,vy:-Math.sin(a)*35,l:.18,c:(T*24|0)%2?'#00f5d4':'#ffe066'});
   }
   if(e.lkT<=0){
    e.st=2;
    snd(160,.28,'sawtooth',.06,650,1);
    noise(.24,2200,300,.14,'bandpass');
   }
  }else{
   e.x+=Math.cos(e.da)*e.spd*dt;
   e.y+=Math.sin(e.da)*e.spd*dt;
   fx.push({x:e.x-Math.cos(e.da)*6,y:e.y-Math.sin(e.da)*6,vx:(R()-.5)*18,vy:(R()-.5)*18,l:.22,c:(T*30|0)%2?'#00f5d4':'#ffd700'});
  }
  break;
 }}}

 lives--;boom(p.x,p.y,34);boomS(0);rf=.3;pow=1;powT=POW_DECAY;eb=[];

}

 if(!paused){g.fillRect(86,5,3,9);g.fillRect(91,5,3,9)}
 else{g.beginPath();g.moveTo(87,5);g.lineTo(95,9.5);g.lineTo(87,14);g.fill()}
 g.globalAlpha=1;
}

/* ====== TELAS / UI / RANKING COM DATA, MINIATURA E OURO/PRATA/BRONZE ====== */
async function leader(){
 const r=await getTop(20),t=r.list.find(e=>!bad(e.name));
 const el=$('#hi');el.innerHTML='';
 if(t){
  const si=shipIdxByName(t.ship),dt=fmtDate(t.t);
  const img=document.createElement('img');img.src=SHIP_URLS[si];img.className='rk-ic';
  const spn=document.createElement('span');
  spn.textContent=`RECORDE: ${t.name} ${pad(t.score)}${dt?' ('+dt+')':''}`;
  el.append(img,spn);
  topScore=Math.max(topScore,t.score);
 }
}
function show(s){state=s;paused=false;document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id=='s-'+s));if(s=='title'){stage=1;syncSideBtn();leader()}}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
document.documentElement.style.setProperty('--ship',`url(${SHIP_URLS[0]})`);
const mi=[...document.querySelectorAll('.mi')];let mc=0;
function mcur(i){mc=i;mi.forEach((b,j)=>b.classList.toggle('cur',j==i))}
mi.forEach((b,i)=>{b.onpointerenter=()=>mcur(i);b.onclick=()=>{
 mcur(i);const a=b.dataset.act;
 if(a=='play'){sel=0;show('select')}
 else if(a=='rank')openRank();
 else if(a=='side'){toggleSide();snd(650,.06)}
 else{mute=!mute;b.textContent='SOUND: '+(mute?'OFF':'ON')}
}});
function launch(){if(state!='select')return;ship=sel;state='takeoff';tk=0;engine(1.8)}
$('#again').onclick=()=>show('select');
$('#nm').oninput=e=>{
 e.target.value=e.target.value.replace(/[^A-Za-z0-9 _.-]/g,'').toUpperCase();
 e.target.classList.remove('err');
};
$('#nm').onkeydown=e=>{if(e.key=='Enter')$('#send').click()};

/* Game Over exige digitar o nome a cada tentativa para ir ao ranking */
function gameOver(){
 if(score>hi){hi=score;localStorage.sb_hi=hi}
 show('over');
 $('#fs').textContent='PONTOS: '+score;
 const inp=$('#nm');
 inp.value='';
 inp.classList.remove('err');
 $('#send').disabled=false;
 $('#msg').style.color='#9aa0c8';
 $('#msg').textContent=ON?'DIGITE SEU NOME PARA SALVAR NO RANKING':'MODO LOCAL: DIGITE SEU NOME PARA SALVAR';
}

$('#send').onclick=async()=>{
 const inp=$('#nm');
 const n=inp.value.trim().slice(0,10);
 if(!n){
  inp.classList.add('err');
  inp.focus();
  $('#msg').style.color='#ff4d4d';
  $('#msg').textContent='OBRIGATORIO COLOCAR O NOME PARA IR AO RANKING!';
  snd(180,.18,'sawtooth',.06,110);
  return;
 }
 if(bad(n)){
  inp.classList.add('err');
  $('#msg').style.color='#ff4d4d';
  $('#msg').textContent='NOME NAO PERMITIDO. ESCOLHA OUTRO.';
  snd(180,.18,'sawtooth',.06,110);
  return;
 }
 localStorage.sb_name=n;
 $('#send').disabled=true;
 $('#msg').style.color='#9aa0c8';
 $('#msg').textContent='ENVIANDO...';
 try{await sendScore(n,score,ship)}catch(e){$('#msg').textContent='SEM CONEXAO: SALVO SO NESTE APARELHO';await new Promise(r=>setTimeout(r,1200))}
 openRank(n);
};

async function openRank(me){
 show('rank');const ul=$('#list');ul.innerHTML='<li>CARREGANDO...</li>';$('#note').textContent='';
 const r=await getTop();ul.innerHTML='';
 r.list.filter(e=>!bad(e.name)).slice(0,30).forEach((e,i)=>{
  const li=document.createElement('li');
  if(i==0)li.classList.add('r1');
  else if(i==1)li.classList.add('r2');
  else if(i==2)li.classList.add('r3');
  if(me&&e.name==me&&e.score==score)li.classList.add('me');

  const left=document.createElement('span');left.className='rk-l';
  const pos=document.createElement('span');pos.textContent=(i+1)+'.';
  const img=document.createElement('img');img.src=SHIP_URLS[shipIdxByName(e.ship)];img.className='rk-ic';
  const nm=document.createElement('span');nm.textContent=e.name;
  left.append(pos,img,nm);

  const right=document.createElement('span');right.className='rk-r';
  const dtStr=fmtDate(e.t);
  if(dtStr){const dt=document.createElement('span');dt.className='rk-dt';dt.textContent=dtStr;right.append(dt)}
  const sc=document.createElement('span');sc.textContent=pad(e.score);
  right.append(sc);

  li.append(left,right);ul.append(li);
 });
 if(!ul.children.length)ul.innerHTML='<li>SEJA O PRIMEIRO!</li>';const mine=ul.querySelector('.me');if(mine)ul.scrollTop=mine.offsetTop-(ul.clientHeight-mine.offsetHeight)/2;
 $('#note').textContent=r.local?(ON?'OFFLINE: RANKING LOCAL':'RANKING LOCAL'):'ONLINE: TODOS OS JOGADORES';
}

/* ====== ENTRADA MULTI-TOUCH SEM CONFLITO ENTRE CONTROLE E SUPER ====== */
addEventListener('keydown',e=>{const k=e.key.length>1?e.key:e.key.toLowerCase();K[k]=1;
 if(state=='play'){
  if(k.includes('Arrow')||k==' ')e.preventDefault();
  if(k=='p'||k=='Escape')paused=!paused;
  else if(k==' '||k=='b')useSuper();
 }
 else if(state=='title'){if(k=='ArrowUp')mcur((mc+mi.length-1)%mi.length);if(k=='ArrowDown')mcur((mc+1)%mi.length);if(k=='Enter'||k==' ')mi[mc].click()}
 else if(state=='select'){if(k=='ArrowLeft')sel=(sel+5)%6;if(k=='ArrowRight')sel=(sel+1)%6;if(k=='Enter'||k==' ')launch();if(k=='Escape')show('title')}});
addEventListener('keyup',e=>K[e.key.length>1?e.key:e.key.toLowerCase()]=0);

let movePtrId=null,tp=null;
addEventListener('pointerdown',e=>{
 const r=cv.getBoundingClientRect(),cx=(e.clientX-r.left)/r.width*W,cy=(e.clientY-r.top)/r.height*H;
 if(state=='select'){
  for(let i=0;i<6;i++)if(cx>=SX(i)-2&&cx<=SX(i)+SW+2&&cy>=SY-14&&cy<=SY+SH+16){if(sel==i)launch();else{sel=i;snd(700,.05)}return}
  if(cx>40&&cx<140&&cy>232&&cy<260)launch();else if(cx<70&&cy>286)show('title');
 }else if(state=='play'){
  if(cx>=76&&cx<=104&&cy>=0&&cy<=20){paused=!paused;snd(500,.05);return}
  if(paused){
   if(cx>=26&&cx<=154&&cy>=120&&cy<=152){paused=false;snd(600,.06);return}
   if(cx>=26&&cx<=154&&cy>=158&&cy<=188){snd(400,.06);show('title');return}
   if(cx>=26&&cx<=154&&cy>=194&&cy<=226){toggleSide();snd(650,.06);return}
   return}
  if((!sLeft&&cx>=W-42&&cy>=H-30)||(sLeft&&cx<=42&&cy>=H-30)){useSuper();return}
  if(movePtrId===null){
   movePtrId=e.pointerId;
   tp={x:e.clientX,y:e.clientY,ox:p.tx,oy:p.ty};
  }
 }
});
addEventListener('pointermove',e=>{
 if(e.pointerId!==movePtrId||!tp||state!='play'||paused||clr>0)return;
 const k=cv.clientWidth/W;
 p.tx=clamp(tp.ox+(e.clientX-tp.x)/k*1.25,6,W-6);
 p.ty=clamp(tp.oy+(e.clientY-tp.y)/k*1.25,34,H-24);
});
function endPtr(e){if(e.pointerId===movePtrId){movePtrId=null;tp=null}}
addEventListener('pointerup',endPtr);
addEventListener('pointercancel',endPtr);
document.addEventListener('touchmove',e=>{if(!(e.target.closest&&e.target.closest('#list')))e.preventDefault()},{passive:false});

function rs(){const s=Math.min(innerWidth/W,innerHeight/H),k=s>=2?Math.floor(s*2)/2:s,b=$('#box');b.style.width=W*k+'px';b.style.height=H*k+'px';$('#ui').style.fontSize=k*7+'px'}
addEventListener('resize',rs);rs();

/* ====== LOOP & REGISTRO DO SERVICE WORKER (PWA / PLAY STORE) ====== */
let last=0;function loop(ts){const dt=Math.min(.05,(ts-last)/1000||0);last=ts;if(!paused)T+=dt;bgUpd(dt);if(state=='play')upd(dt);if(state=='takeoff'&&(tk+=dt)>1.5)start(ship);draw();requestAnimationFrame(loop)}
show('title');requestAnimationFrame(loop);
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script><script>
// Remove o selo "Powered by Netlify" (inclusive se for injetado depois)
(function () {
    const SEL = '#netlify-badge, #netlify-badge-container, a[href*="netlify.com"], div[id*="netlify" i], div[class*="netlify" i], iframe[src*="netlify.com"], [data-netlify-badge]';
    const STYLE_ID = 'no-netlify-badge-style';
    const CSS = SEL + '{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;}';

    function clean(doc) {
        try {
            if (!doc || !doc.body) return;
            if (!doc.getElementById(STYLE_ID)) {
                const st = doc.createElement('style');
                st.id = STYLE_ID;
                st.textContent = CSS;
                (doc.head || doc.documentElement).appendChild(st);
            }
            doc.querySelectorAll(SEL).forEach(el => el.remove());
            doc.querySelectorAll('body > *:not(script):not(style)').forEach(el => {
                const txt = (el.textContent || '').trim();
                if (txt.length < 60 && /powered\s+by\s+netlify/i.test(txt)) el.remove();
            });
        } catch (e) { /* ignora */ }
    }

    function start() {
        clean(document);
        new MutationObserver(() => clean(document))
            .observe(document.documentElement, { childList: true, subtree: true });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
})();
</script></body></html>
