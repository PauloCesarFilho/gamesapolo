  grid[5][4+(rd()*4|0)]=0;grid[12][4+(rd()*4|0)]=0;grid[5+(rd()*7|0)][3]=0;grid[5+(rd()*7|0)][8]=0},
 rd=>{for(let r=2;r<16;r++){if(r!=7&&r!=10){grid[r][5]=1;grid[r][6]=1}}for(let c=1;c<11;c++)if(c!=3&&c!=8)grid[9][c]=1},
 rd=>{for(let k=0;k<14;k++){const c=1+(rd()*5|0),r=2+(rd()*14|0);grid[r][c]=1;grid[r][11-c]=1}},
 rd=>{for(let r=3;r<16;r+=3)for(let c=1;c<11;c++){const on=((r/3)|0)%2?(c%3==1):(c%3==0);if(on&&rd()<.85)grid[r][c]=1}},
 rd=>{[[3,3],[8,3],[3,8],[8,8],[3,13],[8,13]].forEach(([cc,rr])=>{grid[rr][cc]=1;[[0,-1],[0,1],[-1,0],[1,0]].forEach(([dc,dr])=>{grid[rr+dr][cc+dc]=1})})},
 rd=>{for(let c=2;c<10;c++){grid[3][c]=1;grid[14][c]=1}for(let r=3;r<15;r++){grid[r][2]=1;grid[r][9]=1}
  grid[3][3+(rd()*6|0)]=0;grid[14][3+(rd()*6|0)]=0;grid[7][8]=grid[8][8]=grid[7][9]=grid[8][9]=1},
 rd=>{for(let c=4;c<8;c++){grid[6][c]=1;grid[11][c]=1}for(let r=6;r<12;r++){grid[r][4]=1;grid[r][7]=1}
  grid[6][5+(rd()*2|0)]=0;grid[11][5+(rd()*2|0)]=0;grid[6+(rd()*5|0)][4]=0;grid[6+(rd()*5|0)][7]=0}
 ,rd=>{for(let i=0;i<9;i++){if(i!=4){grid[4+i][2+i]=1;grid[4+i][9-i]=1}}},
 rd=>{[3,6,9,12].forEach((r,i)=>{for(let c=1;c<11;c++){if(i%2==0?c<8:c>3)grid[r][c]=1}})},
 rd=>{for(let k=0;k<16;k++){grid[2+(rd()*12|0)][1+(rd()*10|0)]=1}},
 rd=>{for(let c=1;c<11;c++)if(c!=3&&c!=8)grid[8][c]=1;for(let r=2;r<8;r++)if(r!=4){grid[r][5]=1;grid[r][6]=1}for(let r=10;r<16;r++)if(r!=12)grid[r][5]=1}
];
function eggFloorN(c,r){let n=0;[[0,-1],[0,1],[-1,0],[1,0]].forEach(([dc,dr])=>{if(grid[r+dr]&&grid[r+dr][c+dc]==0)n++});return n}
function flood(c0,r0){
 const seen=new Set([c0+','+r0]),q=[[c0,r0]];
 while(q.length){const[c,r]=q.pop();
  [[0,-1],[0,1],[-1,0],[1,0]].forEach(([dc,dr])=>{
   const nc=c+dc,nr=r+dr,k=nc+','+nr;
   if(nc<1||nc>10||nr<1||nr>16||grid[nr][nc]!=0||seen.has(k))return;
   seen.add(k);q.push([nc,nr])})}
 return seen;
}
function pickType(r,rd){
 const pool=[0,0,0,0];
 if(r>=3)pool.push(1,1,1);
 if(r>=5)pool.push(2,2);
 if(r>=7)pool.push(3,3);
 if(r>=9)pool.push(4);
 if(r>=4)pool.push(5,5);
 if(r>=6)pool.push(6);
 if(r>=8)pool.push(7,7);
 return pool[rd()*pool.length|0];
}
function pickBox(r,rd){const q=rd();return r>=3&&q<.08?7:r>=2&&q<.25?5:2}
function buildRoom(r){
 const d=diff(r),rd=rg(r*7919+42);
 grid=[];for(let rr=0;rr<ROWS;rr++)grid.push(new Array(COLS).fill(0));
 for(let c=0;c<COLS;c++){grid[0][c]=1;grid[ROWS-1][c]=1}
 for(let rr=0;rr<ROWS;rr++){grid[rr][0]=1;grid[rr][COLS-1]=1}
 grid[0][5]=4;grid[0][6]=4;
 PATS[(r-1)%PATS.length](rd);
 for(let rr=14;rr<17;rr++)for(let c=3;c<9;c++)if(grid[rr][c]==1)grid[rr][c]=0;
 for(let c=4;c<8;c++)if(grid[1][c]==1)grid[1][c]=0;
 const seen=flood(5,15);
 for(let rr=1;rr<17;rr++)for(let c=1;c<11;c++)if(grid[rr][c]==0&&!seen.has(c+','+rr))grid[rr][c]=1;
 /* ovos */
 eggs=[];
 const cand=[...seen].map(k=>k.split(',').map(Number)).filter(([c,rr])=>rr<=12&&Math.abs(c-5)+Math.abs(rr-15)>=7);
 for(let i=cand.length-1;i>0;i--){const j=rd()*(i+1)|0;[cand[i],cand[j]]=[cand[j],cand[i]]}
 for(let i=0;i<d.eggs&&i<cand.length;i++){
  const[c,rr]=cand[i];
  grid[rr][c]=3;
  eggs.push({c,r:rr,type:pickType(r,rd),hatch:1.4+i*d.interval+rd()*.5,dmg:0});
 }
 /* caixas */
 let n=20+(rd()*8|0),tries=0;
 const free=[...seen].map(k=>k.split(',').map(Number)).filter(([c,rr])=>grid[rr][c]==0&&!(rr>=13&&c>=2&&c<=9)&&!(rr==1&&c>=4&&c<=7));
 for(let i=free.length-1;i>0;i--){const j=rd()*(i+1)|0;[free[i],free[j]]=[free[j],free[i]]}
 while(n>0&&tries<free.length){
  const[c,rr]=free[tries++];
  if(grid[rr][c]!=0)continue;
  let ok=true;
  eggs.forEach(e=>{if(Math.abs(e.c-c)+Math.abs(e.r-rr)==1&&eggFloorN(e.c,e.r)<=1)ok=false});
  if(ok){grid[rr][c]=pickBox(r,rd);n--}
 }
 roomDirty=true;doorOpen=false;
 return d;
}

/* ====== COLISAO ====== */
function solid(x,y){
 if(x<2||x>W-2||y<GY||y>=BY)return true;
 const c=(x/TILE)|0,r=((y-GY)/TILE)|0,v=grid[r]&&grid[r][c];
 return v==1||v==2||v==3||v==5||v==6||v==7||(v==4&&!doorOpen);
}
function hitWorld(x,y){
 return solid(x-5,y-4)||solid(x+5,y-4)||solid(x-5,y+4)||solid(x+5,y+4);
}

 freezeT=0;transPh=0;doorOpen=false;
 banner={txt:'FASE '+r,t:1.6,dur:1.6};
 tp=null;
}

function boom(c0,r0){
 grid[r0][c0]=0;roomDirty=true;boomFx(cx(c0),cy(r0),'#ff7a2a');flash=.3;shake=5;noise(.5,2500,60,.3);snd(90,.4,'sawtooth',.08,30);score+=50;addPop(cx(c0),cy(r0),'50');
 for(let dr=-1;dr<=1;dr++)for(let dc=-1;dc<=1;dc++){
  const c=c0+dc,r=r0+dr,v=grid[r]&&grid[r][c];
  if(v==2||v==5||v==6){grid[r][c]=0;debrisFx(cx(c),cy(r));score+=10}
  else if(v==7)boom(c,r);
 }
 en.forEach(e=>{if(!e.dead&&Math.hypot(e.x-cx(c0),e.y-cy(r0))<26){if(e.st=='big'){e.st='small';e.smT=EN_DEF[e.t].smT;score+=50}else killEnemy(e)}});

/* ====== INIMIGOS ====== */
function spawnEnemy(c,r,t){
 en.push({t,c,r,x:cx(c),y:cy(r),tc:{c,r},dir:-1,st:'big',smT:0,spd:EN_DEF[t].spd*spdMul,ph:R()*6,pauseT:.5,lfx:R()<.5?-1:1,hopV:false,dead:false});
 hatchFx(cx(c),cy(r));
 snd(520,.2,'triangle',.05,780);noise(.18,1400,300,.06);
}
function updHatch(){
 const cap=Math.min(8,3+(round/4|0));
 for(let i=0;i<eggs.length;i++){
  if(en.length>=cap)break;
  const e=eggs[i];
  if(e.hatch>roundT)continue;
  if(EN_DEF[e.type].fly&&en.filter(x=>EN_DEF[x.t].fly).length>=2)continue;
  eggs.splice(i,1);i--;
  grid[e.r][e.c]=0;roomDirty=true;
  spawnEnemy(e.c,e.r,e.type);
 }
}
const DIRS=[[0,-1],[-1,0],[0,1],[1,0]];
function chooseNext(e){
 const opts=[];
 for(let i=0;i<4;i++){
  const nc=e.c+DIRS[i][0],nr=e.r+DIRS[i][1];
  if(nc<1||nc>10||nr<1||nr>16||grid[nr][nc]!=0)continue;
  opts.push({i,nc,nr,w:1});
 }
 if(!opts.length){e.pauseT=.4;return}
 const pc=clamp((p.x/TILE)|0,1,10),pr=clamp(((p.y-GY)/TILE)|0,1,16);
 const pool=[];
 opts.forEach(o=>{
  let w=1;
  if(o.i==(e.dir^2))w=.15;
  if(o.nc!=e.c&&Math.sign(pc-e.c)==Math.sign(o.nc-e.c))w+=2.1;
  if(o.nr!=e.r&&Math.sign(pr-e.r)==Math.sign(o.nr-e.r))w+=2.1;
  for(let k=0;k<Math.max(1,Math.round(w*10));k++)pool.push(o);
 });
 const pick=pool[R()*pool.length|0];
 e.dir=pick.i;
 if(DIRS[pick.i][0])e.lfx=DIRS[pick.i][0];
 let dist=1;
 if(EN_DEF[e.t].hop){
  const nc2=e.c+DIRS[pick.i][0]*2,nr2=e.r+DIRS[pick.i][1]*2;
  if(nc2>=1&&nc2<=10&&nr2>=1&&nr2<=16&&grid[nr2][nc2]==0){dist=2;e.hopV=true}
 }
 e.tc={c:e.c+DIRS[pick.i][0]*dist,r:e.r+DIRS[pick.i][1]*dist};
}
function updEnemy(e,dt){
 if(e.st=='small'){
  e.smT-=dt;
  if(e.smT<=0){e.st='grow';e.gT=.55;snd(200,.2,'triangle',.03,600)}
  return;
 }
 if(e.st=='grow'){e.gT-=dt;if(e.gT<=0)e.st='big';return}
 if(EN_DEF[e.t].fly){
  const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1,s=e.spd*dt;
  e.x+=dx/d*s;e.y+=dy/d*s+Math.sin(T*4+e.ph)*.25;
  e.x=clamp(e.x,8,W-8);e.y=clamp(e.y,GY+8,BY-8);
  if(Math.abs(dx)>1)e.lfx=dx>0?1:-1;
  return;
 }
 if(e.pauseT>0){e.pauseT-=dt;return}
 const txp=cx(e.tc.c),typ=cy(e.tc.r);
 const dx=txp-e.x,dy=typ-e.y,d=Math.hypot(dx,dy);
 const st=e.spd*(e.hopV?3.2:1)*dt;
 if(d<=st||d<.5){
  e.x=txp;e.y=typ;e.c=e.tc.c;e.r=e.tc.r;e.hopV=false;
  if(EN_DEF[e.t].hop){e.pauseT=.5+R()*.4;snd(240,.06,'square',.02,420)}
  chooseNext(e);
 }else{e.x+=dx/d*st;e.y+=dy/d*st}
}

/* ====== TIROS ====== */
function shoot(){
 if(p.fireT>0||freezeT>0||transPh)return false;
 p.fireT=.22;muzzleT=.06;recoilT=.06;
 const m=muzzle(p.fy<0?1:p.fy>0?0:p.fx<0?2:3);bul.push({x:m[0]+.5,y:m[1]+.5,vx:p.fx*260,vy:p.fy*260});
 snd(920,.05,'square',.018,240);
 return true;
}
function updBullets(dt){
 for(let i=bul.length-1;i>=0;i--){
  const b=bul[i];
  b.x+=b.vx*dt;b.y+=b.vy*dt;
  if(b.x<0||b.x>W||b.y<GY-2||b.y>BY+2){bul.splice(i,1);continue}
  const c=(b.x/TILE)|0,r=((b.y-GY)/TILE)|0,v=grid[r]&&grid[r][c];
  if(v==1||(v==4&&!doorOpen)){sparkFx(b.x,b.y);bul.splice(i,1);continue}
  if(v==5||v==6){grid[r][c]=v==5?6:0;roomDirty=true;if(v==5){sparkFx(b.x,b.y);score+=5;snd(260,.06,'square',.03,140)}else{debrisFx(cx(c),cy(r));score+=30;addPop(cx(c),cy(r),'30');noise(.14,900,120,.12)}bul.splice(i,1);continue}
  if(v==7){boom(c,r);bul.splice(i,1);continue}
  if(v==2){
   grid[r][c]=0;roomDirty=true;
   debrisFx(c*TILE+7,GY+r*TILE+7);
   score+=10;addPop(cx(c),cy(r),'10');
   noise(.14,900,120,.12);
   bul.splice(i,1);continue;
  }
  if(v==3){
   const e=eggs.find(q=>q.c==c&&q.r==r);
   if(e){e.dmg++;e.hatch=Math.max(roundT+.3,e.hatch-1.5);score+=5;snd(200,.08,'square',.03,120)}
   bul.splice(i,1);continue;
  }
  let hit=false;
  for(const e of en){
   if(e.dead)continue;
   const rad=e.st=='small'?5:6.5;
   if(Math.hypot(e.x-b.x,e.y-b.y)<rad){
    if(e.st=='big'){e.st='small';e.smT=EN_DEF[e.t].smT;score+=50;addPop(e.x,e.y,'50');snd(300,.12,'square',.045,150)}
    else killEnemy(e);
    sparkFx(b.x,b.y);
    hit=true;break;
   }
  }
  if(hit){bul.splice(i,1);continue}
 }
 en=en.filter(e=>!e.dead);
 checkLife();
}

/* ====== EFEITOS ====== */
function addPop(x,y,txt){ftx.push({txt,x,y,t:.9})}
function sparkFx(x,y){for(let i=0;i<4;i++)fx.push({x,y,vx:(R()*2-1)*40,vy:(R()*2-1)*40,t:.15,col:'#ffd23f',sz:2,g:0})}
function debrisFx(x,y){for(let i=0;i<8;i++)fx.push({x,y,vx:(R()*2-1)*70,vy:-R()*60,t:.5,col:R()<.5?'#8a4f24':'#b06a2e',sz:2,g:160})}
function poofFx(x,y,col){for(let i=0;i<10;i++)fx.push({x,y,vx:(R()*2-1)*60,vy:(R()*2-1)*60,t:.35,col,sz:2,g:0})}
function boomFx(x,y,col){for(let i=0;i<18;i++)fx.push({x,y,vx:(R()*2-1)*130,vy:(R()*2-1)*130,t:.6,col:R()<.5?col:'#ffd23f',sz:R()<.3?3:2,g:60})}
function hatchFx(x,y){for(let i=0;i<8;i++)fx.push({x,y,vx:(R()*2-1)*50,vy:-R()*50,t:.4,col:'#f8f8f8',sz:2,g:120})}
function updFx(dt){
 for(let i=fx.length-1;i>=0;i--){const f=fx[i];f.t-=dt;if(f.t<=0){fx.splice(i,1);continue}f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.g)f.vy+=f.g*dt}
 for(let i=ftx.length-1;i>=0;i--){const f=ftx[i];f.t-=dt;f.y-=14*dt;if(f.t<=0)ftx.splice(i,1)}
 if(shake>0)shake=Math.max(0,shake-dt*18);
 if(flash>0)flash=Math.max(0,flash-dt);
 if(muzzleT>0)muzzleT-=dt;
 if(recoilT>0)recoilT-=dt;
}

/* ====== ATUALIZACAO PRINCIPAL ====== */
function upd(dt){
 if(state!='play'||paused)return;
 if(banner){banner.t-=dt;if(banner.t<=0)banner=null}
 if(transPh){
  transT-=dt;
  if(transT<=0){
   if(transPh==1){startRound(round+1);transT=.55;transPh=2}
   else transPh=0;
  }
  return;
 }
 roundT+=dt;
 updHatch();
 if(freezeT>0){
  freezeT-=dt;updFx(dt);
  if(freezeT<=0){
   if(lives<=0)gameOver();
   else{en=en.filter(e=>!e.dead);respawn()}
  }
  return;
 }
 en=en.filter(e=>!e.dead);
 /* jogador */
 if(p.inv>0)p.inv-=dt;
 p.fireT-=dt;
 let mx=0,my=0;
 if(K.ArrowLeft||K.a)mx--;
 if(K.ArrowRight||K.d)mx++;
 if(K.ArrowUp||K.w)my--;
 if(K.ArrowDown||K.s)my++;
 let tx=0,ty=0;
 if(tp){
  const dx=tp.tx-p.x,dy=tp.ty-p.y,d=Math.hypot(dx,dy);
  if(d>2){tx=dx/d;ty=dy/d}
 }else if(mx||my){const n=Math.hypot(mx,my);tx=mx/n;ty=my/n}
 p.mv=false;const ox=p.x,oy=p.y;
 if(tx||ty){
  const sp=74*dt;
  axisMove(tx*sp,0);axisMove(0,ty*sp);p.mv=p.x!=ox||p.y!=oy;
  if(Math.abs(tx)>Math.abs(ty)){p.fx=Math.sign(tx);p.fy=0}
  else if(Math.abs(ty)>Math.abs(tx)){p.fy=Math.sign(ty);p.fx=0}
  p.walk+=dt*8;
 }
 if(fireHeld()||fireQ){if(shoot())fireQ=false}
 updPlayerDoor();
 /* inimigos */
 en.forEach(e=>updEnemy(e,dt));
 /* colisao jogador x inimigo: bicho grande machuca; bolinha encolhida e coletada ao pisar */
 for(const e of en){
  if(e.st=='big'){
   if(p.inv<=0&&Math.hypot(e.x-p.x,e.y-p.y)<8.6){playerDie();break}
  }else if(e.st=='small'&&Math.hypot(e.x-p.x,e.y-p.y)<7.5)killEnemy(e);
 }
 updBullets(dt);
 updFx(dt);
 checkClear();
 /* tempo */
 timeLeft-=dt;
 if(timeLeft<=0){timeLeft=roundTime;banner={txt:'TEMPO ESGOTADO!',t:1.2,dur:1.2};playerDie()}
}
function updPlayerDoor(){
 if(doorOpen&&p.y<GY+10&&Math.abs(p.x-90)<14)roundClear();
}
function axisMove(dx,dy){
 const s=Math.sign(dx||dy);
 if(!s)return;
 let mv=Math.abs(dx||dy);
 let guard=16;
 while(mv>0&&guard-->0){
  const stp=Math.min(1,mv);
  if(hitWorld(p.x+s*stp*(dx?1:0),p.y+s*stp*(dy?1:0)))break;
  if(dx)p.x+=s*stp;else p.y+=s*stp;
  mv-=stp;
 }
}

const GUN_V=mk(["kk","kk","kk","ko"],{k:'#3a4a5c',o:'#ffd23f'});
const GUN_VU=mk(["ok","kk","kk","kk"],{k:'#3a4a5c',o:'#ffd23f'});

/* Paletas por fase no estilo Teddy Boy (parede rosa/teal/cinza etc sobre piso teal) */
const RPAL=[
 {wt:'#ef8ee0',wf:'#c060b0',wo:'#6a2c6a',fl:'#40a8a0',oc:'#246a66'},
 {wt:'#58c8ec',wf:'#2090c0',wo:'#0c4868',fl:'#38a0a0',oc:'#1e6062'},
 {wt:'#f09848',wf:'#bc6820',wo:'#683810',fl:'#40a8a8',oc:'#246a66'},
 {wt:'#68d060',wf:'#309038',wo:'#0e5018',fl:'#38a8b0',oc:'#20706a'},
 {wt:'#f8e060',wf:'#c0a020',wo:'#6a5810',fl:'#3a78c0',oc:'#245090'},
 {wt:'#f06868',wf:'#b83838',wo:'#601818',fl:'#58a050',oc:'#386c34'},
 {wt:'#b0b8c8',wf:'#7880a0',wo:'#383c58',fl:'#605890',oc:'#403868'},
 {wt:'#58e0b0',wf:'#20a078',wo:'#0c5038',fl:'#b07848',oc:'#805028'}
];
const WT=9,WF=6; /* face superior / face frontal do bloco (9+6=15) */
function renderRoom(){
 const P=RPAL[(round-1)%RPAL.length],x=roomCv.getContext('2d');
 x.fillStyle='#000';x.fillRect(0,0,W,H);
 x.fillStyle=P.fl;x.fillRect(0,GY,W,GH);
 /* piso: octogonos vazados espalhados, como no original */
 x.strokeStyle=P.oc;x.lineWidth=1;
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  if(((c*7+r*13)&3)!=0)continue;
  const ox=c*TILE+7,oy=GY+r*TILE+7;
  x.beginPath();
  for(let i=0;i<8;i++){
   const a=Math.PI/8+i*Math.PI/4,px2=ox+Math.cos(a)*5,py2=oy+Math.sin(a)*5;
   i?x.lineTo(px2,py2):x.moveTo(px2,py2);
  }
  x.closePath();x.stroke();
 }
 for(let r=0;r<ROWS;r++)for(let c=0;c<COLS;c++){
  const v=grid[r][c],px=c*TILE,py=GY+r*TILE;
  if(v==1){
   /* bloco 3D: face superior clara com rebites + face frontal escura */
   x.fillStyle=P.wt;x.fillRect(px,py,TILE,WT);
   x.fillStyle='#ffffff';
   for(let yy=2;yy<WT-1;yy+=3)for(let xx=3;xx<TILE-2;xx+=4)x.fillRect(px+xx,py+yy,1,1);
   x.fillStyle=P.wf;x.fillRect(px,py+WT,TILE,WF);
   x.fillStyle='#ffffff88';
   for(let xx=2;xx<TILE-2;xx+=4)x.fillRect(px+xx,py+WT+2,1,1);
   x.fillStyle=P.wo;
   x.fillRect(px,py,TILE,1);x.fillRect(px,py+WT,TILE,1);
   x.fillRect(px,py,1,TILE);x.fillRect(px+TILE-1,py,1,TILE);
   x.fillRect(px,py+TILE-1,TILE,1);
  }else if(v==2){
   /* caixa: caixote 3D de madeira, face limpa com pranchas */
   x.fillStyle='#d89850';x.fillRect(px,py,TILE,WT);
   x.fillStyle='#a87030';x.fillRect(px,py+WT,TILE,WF);
   x.fillStyle='#5a3a18';
   x.fillRect(px,py,TILE,1);x.fillRect(px,py+WT,TILE,1);
   x.fillRect(px,py,1,TILE);x.fillRect(px+TILE-1,py,1,TILE);
   x.fillRect(px,py+TILE-1,TILE,1);
   x.fillRect(px+2,py+3,TILE-4,1);x.fillRect(px+2,py+WT-4,TILE-4,1);
   x.fillStyle='#c07838';x.fillRect(px+2,py+WT+2,TILE-4,1);
   x.fillStyle='#f0c088';x.fillRect(px+2,py+1,TILE-4,1);
  }else if(v==5||v==6){
   x.fillStyle='#b8c0d0';x.fillRect(px,py,TILE,WT);x.fillStyle='#707890';x.fillRect(px,py+WT,TILE,WF);
   x.fillStyle='#303850';x.fillRect(px,py,TILE,1);x.fillRect(px,py+WT,TILE,1);x.fillRect(px,py,1,TILE);x.fillRect(px+TILE-1,py,1,TILE);x.fillRect(px,py+TILE-1,TILE,1);
   x.fillStyle='#e8f0f8';x.fillRect(px+2,py+2,1,1);x.fillRect(px+TILE-3,py+2,1,1);x.fillRect(px+2,py+WT-2,1,1);x.fillRect(px+TILE-3,py+WT-2,1,1);
   if(v==6){x.fillStyle='#303850';x.fillRect(px+6,py+2,1,2);x.fillRect(px+7,py+4,1,2);x.fillRect(px+5,py+6,1,2);x.fillRect(px+8,py+WT+1,1,3)}
  }else if(v==7){
   x.fillStyle='#e84848';x.fillRect(px,py,TILE,WT);x.fillStyle='#a82828';x.fillRect(px,py+WT,TILE,WF);
   x.fillStyle='#501010';x.fillRect(px,py,TILE,1);x.fillRect(px,py+WT,TILE,1);x.fillRect(px,py,1,TILE);x.fillRect(px+TILE-1,py,1,TILE);x.fillRect(px,py+TILE-1,TILE,1);
   x.fillStyle='#f8d820';x.fillRect(px+2,py+3,TILE-4,3);x.fillStyle='#501010';x.fillRect(px+7,py+3,1,2);x.fillRect(px+7,py+6,1,1);
   x.fillStyle='#f8d820';x.fillRect(px+2,py+WT+2,TILE-4,1);
  }
 }
 roomDirty=false;
}
function drawDoor(){
 const P=RPAL[(round-1)%RPAL.length],x0=5*TILE,y0=GY,w=2*TILE,h=TILE;
 if(!doorOpen){
  /* fechada: parede de tijolos com marcador piscando */
  g.fillStyle=P.wf;g.fillRect(x0,y0,w,h);
  g.fillStyle=P.wo;
  g.fillRect(x0,y0,w,1);g.fillRect(x0,y0+h-1,w,1);g.fillRect(x0,y0,1,h);g.fillRect(x0+w-1,y0,1,h);
  for(let i=0;i<4;i++)g.fillRect(x0+1,y0+3+i*3,w-2,1);
  g.fillStyle=(T*2|0)&1?'#f84858':'#701420';g.fillRect(x0+w/2-2,y0+5,4,5);
 }else{
  /* aberta: passagem escura com setas amarelas pulsando */
  const pl=.5+.5*Math.sin(T*5);
  g.fillStyle='#0c1018';g.fillRect(x0,y0,w,h);
  g.fillStyle='#f8d820';
  g.fillRect(x0,y0,w,2);g.fillRect(x0,y0+h-2,w,2);g.fillRect(x0,y0,2,h);g.fillRect(x0+w-2,y0,2,h);
  g.globalAlpha=.35+pl*.65;
  g.fillRect(x0+6,y0+4,2,2);g.fillRect(x0+8,y0+6,2,2);g.fillRect(x0+10,y0+4,2,2);
  g.fillRect(x0+12,y0+6,2,2);g.fillRect(x0+14,y0+4,2,2);g.fillRect(x0+16,y0+6,2,2);
  g.fillRect(x0+8,y0+9,2,2);g.fillRect(x0+10,y0+11,2,2);g.fillRect(x0+12,y0+9,2,2);
  g.globalAlpha=1;
  g.fillStyle='#ffffff';
  g.fillRect(x0+10,y0+4,1,1);g.fillRect(x0+12,y0+11,1,1);
 }
}
function drawEggs(){
 eggs.forEach(e=>{
  const px=e.c*TILE,py=GY+e.r*TILE;
  /* dado 3D: face superior branca com pips + face frontal cinza */
  g.fillStyle='#f8f8f8';g.fillRect(px,py,TILE,WT);
  g.fillStyle='#d0d0d8';g.fillRect(px,py+WT,TILE,WF);
  g.fillStyle='#787888';
  g.fillRect(px,py,TILE,1);g.fillRect(px,py+WT,TILE,1);
  g.fillRect(px,py,1,TILE);g.fillRect(px+TILE-1,py,1,TILE);g.fillRect(px,py+TILE-1,TILE,1);
  g.fillStyle='#202028';
  const PX=[3,7,10],PY=[1,4,7],pp=DICE[e.type];
  pp.forEach(([a,b])=>g.fillRect(px+PX[a],py+PY[b],2,2));
  /* dano: rachaduras */
  if(e.dmg>0){g.strokeStyle='#909098';g.lineWidth=1;
   g.beginPath();g.moveTo(px+4.5,py+1.5);g.lineTo(px+7.5,py+5.5);g.lineTo(px+5.5,py+8.5);g.stroke()}
  if(e.dmg>1){g.strokeStyle='#787888';
   g.beginPath();g.moveTo(px+10.5,py+2.5);g.lineTo(px+8.5,py+7.5);g.stroke()}
  if(e.hatch-roundT<1.3&&((T*8|0)&1)){g.strokeStyle='#f84858';g.lineWidth=1;g.strokeRect(px+.5,py+.5,TILE-1,TILE-1)}
 });
}
function drawEnemies(){
 en.forEach(e=>{
  if(e.dead)return;
  g.fillStyle='rgba(0,0,0,.35)';g.fillRect(Math.round(e.x-4),Math.round(e.y+4),8,2);
  if(e.st=='small'){
   if(e.smT<1.2&&((T*8|0)&1))return;
   g.drawImage(EN_SM[e.t],Math.round(e.x-2.5),Math.round(e.y-2.5));
   return;
  }
  const D=EN_DEF[e.t],fr=(T*(D.fly?14:7)|0)&1;
  const sp=(e.lfx>0?EN_SPF:EN_SP)[e.t][fr];
  if(e.st=='grow'){
   const k=1-(e.gT/.55),w2=sp.width*(.45+.55*k),h2=sp.height*(.45+.55*k);
   g.drawImage(sp,e.x-w2/2,e.y-h2/2,w2,h2);
  }else g.drawImage(sp,Math.round(e.x-sp.width/2),Math.round(e.y-sp.height/2));
 });
}
function drawBullets(){
 bul.forEach(b=>{
  const V=b.vy!=0,sx=Math.sign(b.vx),sy=Math.sign(b.vy);g.fillStyle='#f8f8f8';V?g.fillRect(Math.round(b.x-1),Math.round(b.y-2),2,4):g.fillRect(Math.round(b.x-2),Math.round(b.y-1),4,2);
  g.fillStyle='#f8f8f888';g.fillRect(Math.round(b.x-sx*5),Math.round(b.y-sy*5),V?1:2,V?2:1);
 });
}
function drawPlayer(){
 if(state!='play'||freezeT>0||transPh==1)return;
 if(p.inv>0&&((T*10|0)&1))return;
 const dir=p.fy<0?1:p.fy>0?0:p.fx<0?2:3;
 const stp=p.mv?(((p.walk)|0)&1)+1:0,bob=p.mv?stp-1:0;
 const rx=Math.round(p.x),ry=Math.round(p.y);
 g.drawImage(PSPW[dir][stp],rx-6,ry-6+bob);
 const rec=recoilT>0?1:0,m=muzzle(dir);
 if(dir==0)g.drawImage(GUN_V,rx+3,ry+1-rec+bob);
 else if(dir==1)g.drawImage(GUN_VU,rx+3,ry-2+rec+bob);
 else if(dir==2)g.drawImage(GUN_H,rx-8+rec,ry+1+bob);
 else g.drawImage(GUN_HR,rx+3-rec,ry+1+bob);
 if(muzzleT>0){g.fillStyle='#ffd23f';g.fillRect(m[0]-1,m[1]+bob-1,3,3);g.fillStyle='#fff';g.fillRect(m[0],m[1]+bob,1,1)}
}
function muzzle(d){const rx=Math.round(p.x),ry=Math.round(p.y);return d==0?[rx+4,ry+5]:d==1?[rx+3,ry-3]:d==2?[rx-9,ry+1]:[rx+8,ry+1]}
function drawFx(){
 fx.forEach(f=>{g.fillStyle=f.col;g.fillRect(Math.round(f.x),Math.round(f.y),f.sz,f.sz)});
 ftx.forEach(f=>{g.globalAlpha=clamp(f.t/.9,0,1);tx(f.txt,f.x,f.y,'#ffd23f',6,'center');g.globalAlpha=1});
}
function drawHUD(){
 if(!grid.length)return;
 g.fillStyle='#000';g.fillRect(0,0,W,GY);g.fillRect(0,BY,W,H-BY);
 g.fillStyle='#1d2a55';g.fillRect(0,GY-1,W,1);g.fillRect(0,BY,W,1);
 /* topo estilo arcade: 1UP a esquerda, TOP (recorde) a direita */
 tx('1UP',3,2,'#f84858',6);
 tx(pad(score),3,10,'#f8f8f8',7);
 g.fillStyle='#101828';g.fillRect(78,4,24,13);g.fillStyle='#1d2a55';g.fillRect(78,4,24,1);g.fillRect(78,16,24,1);g.fillRect(78,4,1,13);g.fillRect(101,4,1,13);
 g.fillStyle='#f8f8f8';g.fillRect(85,7,3,7);g.fillRect(92,7,3,7);
 tx('TOP',W-3,2,'#f84858',6,'right');
 tx(pad(hi),W-3,10,'#f8f8f8',7,'right');
 /* rodape: vidas e botao de tiro */
 const lx=sLeft?44:4;
 for(let i=0;i<Math.min(lives,5);i++)g.drawImage(MINI_KID,lx+i*10,BY+3);

 const fbx=sLeft?3:W-37,fon=fireHeld();
 g.fillStyle=fon?'#f84858':'#7a1424';g.fillRect(fbx,BY+3,34,11);
 g.fillStyle=fon?'#ffb0b8':'#f84858';g.fillRect(fbx,BY+3,34,1);
 tx('TIRO',fbx+17,BY+5,'#f8f8f8',6,'center');
 /* barra de tempo segmentada tricolor, como no original */
 tx('TIME',3,BY+16,'#9ae0e8',6);
 g.fillStyle='#101828';g.fillRect(28,BY+15,W-32,11);
 const pct=clamp(timeLeft/roundTime,0,1);
 const segs=Math.max(0,Math.round(29*pct));
 for(let i=0;i<segs;i++){
  g.fillStyle=['#f84858','#f8d820','#f8f8f8'][i%3];
  g.fillRect(30+i*5,BY+17,4,7);
 }
 if(pct<=.25&&((T*4|0)&1)){g.fillStyle='#f84858';g.fillRect(28,BY+15,W-32,1)}
}
function drawBanner(){
 if(!banner)return;
 const al=clamp(Math.min((banner.dur-banner.t)*4,banner.t*3),0,1);
 g.globalAlpha=al;
 g.fillStyle='rgba(0,0,0,.8)';g.fillRect(0,128,W,28);
 g.fillStyle='#1d2a55';g.fillRect(0,127,W,1);g.fillRect(0,156,W,1);
 tx(banner.txt,90,138,'#35e0b0',10,'center');
 g.globalAlpha=1;
}
function draw(){
 g.fillStyle='#000';g.fillRect(0,0,W,H);
 if(grid.length){
  const s=shake>0?shake*.5:0;
  g.save();
  if(s)g.translate(Math.round((R()*2-1)*s),Math.round((R()*2-1)*s));
  if(roomDirty)renderRoom();
  g.drawImage(roomCv,0,0);
  drawDoor();drawEggs();drawEnemies();drawBullets();drawPlayer();drawFx();
  g.restore();
 }
 drawHUD();
 drawBanner();
 if(transPh==1){g.fillStyle='rgba(0,0,0,'+clamp(1-transT/.55,0,1)+')';g.fillRect(0,0,W,H)}
 if(transPh==2){g.fillStyle='rgba(0,0,0,'+clamp(transT/.55,0,1)+')';g.fillRect(0,0,W,H)}
 if(flash>0){g.fillStyle='rgba(255,255,255,'+flash*.7+')';g.fillRect(0,0,W,H)}
 if(freezeT>0&&state=='play'){g.fillStyle='rgba(255,40,40,'+freezeT*.18+')';g.fillRect(0,0,W,H)}
}

function show(s){
 state=s;paused=false;fireBtn=null;fireQ=false;
 document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id=='s-'+s));
 if(s=='title'){try{syncSideBtn()}catch(e){}try{leader()}catch(e){}}
}

 const r=await getTop(20),t=r.list.find(e=>!bad(e.name));
 const el=$('#hi');el.innerHTML='';
 if(t){
  const img=document.createElement('img');img.src=ROBO_URL;img.className='rk-ic';
  const spn=document.createElement('span');
  spn.textContent='RECORDE: '+t.name+' '+pad(t.score)+(fmtDate(t.t)?' ('+fmtDate(t.t)+')':'');

 }
}
document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>show(b.dataset.go));
document.documentElement.style.setProperty('--bot','url('+ROBO_URL+')');
const mi=[...document.querySelectorAll('.mi')];let mc=0;
function mcur(i){mc=i;mi.forEach((b,j)=>b.classList.toggle('cur',j==i))}
mi.forEach((b,i)=>{b.onpointerenter=()=>mcur(i);b.onclick=()=>{

 else if(a=='side'){toggleSide();snd(650,.06)}

$('#nm').oninput=e=>{

function gameOverUI(){
 if(score>hi){hi=score;LS.set('bp_hi',hi)}
 show('over');
 $('#fs').textContent='PONTOS: '+score+(round>1?'  FASE '+round:'');
 const inp=$('#nm');
 inp.value='';inp.classList.remove('err');
 $('#send').disabled=false;

$('#send').onclick=async()=>{

 if(!n){
  inp.classList.add('err');
  inp.focus();
  $('#msg').style.color='#ff4d4d';
  $('#msg').textContent='OBRIGATORIO COLOCAR O NOME PARA IR AO RANKING!';
  snd(180,.18,'sawtooth',.06,110);
  return;
 }
 if(bad(n)){
  inp.classList.add('err');
  $('#msg').style.color='#ff4d4d';
  $('#msg').textContent='NOME NAO PERMITIDO. ESCOLHA OUTRO.';
  snd(180,.18,'sawtooth',.06,110);
  return;
 }
 LS.set('bp_name',n);
 $('#send').disabled=true;
 $('#msg').style.color='#9aa0c8';

 try{await sendScore(n,score)}catch(e){$('#msg').textContent='FALHOU ['+String(e).slice(0,50)+'] SALVO SO NESTE APARELHO';await new Promise(r=>setTimeout(r,1200))}

};
async function openRank(me){
 show('rank');const ul=$('#list');ul.innerHTML='<li>CARREGANDO...</li>';$('#note').textContent='';
 const r=await getTop();ul.innerHTML='';
 r.list.filter(e=>!bad(e.name)).slice(0,30).forEach((e,i)=>{
  const li=document.createElement('li');
  if(i==0)li.classList.add('r1');
  else if(i==1)li.classList.add('r2');
  else if(i==2)li.classList.add('r3');
  if(me&&e.name==me&&e.score==score)li.classList.add('me');
  const left=document.createElement('span');left.className='rk-l';
  const pos=document.createElement('span');pos.textContent=(i+1)+'.';
  const img=document.createElement('img');img.src=ROBO_URL;img.className='rk-ic';
  const nm=document.createElement('span');nm.textContent=e.name;
  left.append(pos,img,nm);
  const right=document.createElement('span');right.className='rk-r';
  const dtStr=fmtDate(e.t);
  if(dtStr){const dt=document.createElement('span');dt.className='rk-dt';dt.textContent=dtStr;right.append(dt)}
  const sc=document.createElement('span');sc.textContent=pad(e.score);
  right.append(sc);
  li.append(left,right);ul.append(li);
 });
 if(!ul.children.length)ul.innerHTML='<li>SEJA O PRIMEIRO!</li>';
 const mine=ul.querySelector('.me');if(mine)ul.scrollTop=mine.offsetTop-(ul.clientHeight-mine.offsetHeight)/2;
 $('#note').textContent=r.local?(ON?'OFFLINE: RANKING LOCAL':'RANKING LOCAL'):'ONLINE: TODOS OS JOGADORES';
}

function togglePause(){
 if(state!='play')return;
 paused=!paused;
 $('#s-pause').classList.toggle('on',paused);
 snd(500,.05);
}
$('#pu-res').onclick=()=>{if(paused)togglePause()};
$('#pu-exit').onclick=()=>{show('title')};
$('#pu-side').onclick=()=>{toggleSide();snd(650,.06)};

/* ====== ENTRADA: TECLADO ====== */

addEventListener('keydown',e=>{
 const k=e.key.length>1?e.key:e.key.toLowerCase();
 if(document.activeElement&&document.activeElement.id=='nm')return;
 K[k]=1;
 if(state=='play'){
  if(k.indexOf('Arrow')>=0||k==' ')e.preventDefault();
  if(k=='p'||k=='Escape')togglePause();
  else if(k==' '||k=='b')fireQ=true;
 }
 else if(state=='title'){
  if(k=='ArrowUp')mcur((mc+mi.length-1)%mi.length);
  if(k=='ArrowDown')mcur((mc+1)%mi.length);
  if(k=='Enter'||k==' ')mi[mc].click();
 }
 else if(state=='rank'){if(k=='Escape'||k=='Enter')show('title')}
});
addEventListener('keyup',e=>{const k=e.key.length>1?e.key:e.key.toLowerCase();K[k]=0});

/* ====== ENTRADA: TOQUE / ARRASTAR ====== */
let movePtrId=null,tp=null;
addEventListener('pointerdown',e=>{
 if(e.target.closest&&e.target.closest('.scr'))return;
 const r=cv.getBoundingClientRect(),cxp=(e.clientX-r.left)/r.width*W,cyp=(e.clientY-r.top)/r.height*H;
 if(state=='play'&&!paused){
  if(cxp>=68&&cxp<=112&&cyp<=22){togglePause();return}
  if((!sLeft&&cxp>=W-42&&cyp>=H-30)||(sLeft&&cxp<=42&&cyp>=H-30)){fireBtn=e.pointerId;fireQ=true;return}
  if(movePtrId===null){movePtrId=e.pointerId;tp={x:e.clientX,y:e.clientY,tx:p.x,ty:p.y}}
 }
});
addEventListener('pointermove',e=>{
 if(e.pointerId!==movePtrId||!tp||state!='play'||paused||freezeT>0||transPh)return;
 const k=cv.clientWidth/W;
 tp.tx=clamp(tp.tx+(e.clientX-tp.x)/k*1.25,7,W-7);
 tp.ty=clamp(tp.ty+(e.clientY-tp.y)/k*1.25,GY+7,BY-7);
 tp.x=e.clientX;tp.y=e.clientY;
});
function endPtr(e){if(e.pointerId===fireBtn)fireBtn=null;if(e.pointerId===movePtrId){movePtrId=null;tp=null}}

<script>
// Remove o selo "Powered by Netlify" (inclusive se for injetado depois)
(function () {
    const SEL = '#netlify-badge, #netlify-badge-container, a[href*="netlify.com"], div[id*="netlify" i], div[class*="netlify" i], iframe[src*="netlify.com"], [data-netlify-badge]';
    const STYLE_ID = 'no-netlify-badge-style';
    const CSS = SEL + '{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;}';

    function clean(doc) {
        try {
            if (!doc || !doc.body) return;
            if (!doc.getElementById(STYLE_ID)) {
                const st = doc.createElement('style');
                st.id = STYLE_ID;
                st.textContent = CSS;
                (doc.head || doc.documentElement).appendChild(st);
            }
            doc.querySelectorAll(SEL).forEach(el => el.remove());
            doc.querySelectorAll('body > *:not(script):not(style)').forEach(el => {
                const txt = (el.textContent || '').trim();
                if (txt.length < 60 && /powered\s+by\s+netlify/i.test(txt)) el.remove();
            });
        } catch (e) { /* ignora */ }
    }

    function start() {
        clean(document);
        new MutationObserver(() => clean(document))
            .observe(document.documentElement, { childList: true, subtree: true });
    }

    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
})();
</script></body></html>
