<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>TINY BOMB PIXEL ARENA - Games Apolo</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <!-- Firebase SDK v10 (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }
		
		/* Remove selo "Powered by Netlify" */
		#netlify-badge,
		#netlify-badge-container,
		a[href*="netlify.com"],
		div[id*="netlify" i],
		div[class*="netlify" i],
		iframe[src*="netlify.com"],
		[data-netlify-badge] {
			display: none !important;
			visibility: hidden !important;
			opacity: 0 !important;
			pointer-events: none !important;
		}
		
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #090812;
            background-image: radial-gradient(circle at 50% 25%, #1f1938 0%, #090812 100%);
            color: #f8fafc;
            font-family: 'Press Start 2P', monospace;
            overflow-x: hidden;
            overscroll-behavior: none;
        }

        /* Estilo Retro SNES / Atari Box */
        .retro-panel {
            background: #141224;
            border: 4px solid #f59e0b;
            box-shadow:
                0 0 0 4px #000000,
                0 12px 30px rgba(0, 0, 0, 0.85),
                inset 0 0 0 2px #fde047;
        }

        .retro-subpanel {
            background: #0b0a14;
            border: 2px solid #475569;
            box-shadow: inset 0 2px 6px rgba(0,0,0,0.8);
        }

        .retro-input {
            background: #05050a;
            border: 2px solid #64748b;
            color: #fef08a;
            font-family: 'Press Start 2P', monospace;
            font-size: 11px;
            padding: 10px 12px;
            outline: none;
        }
        .retro-input:focus {
            border-color: #facc15;
            box-shadow: 0 0 8px rgba(250, 204, 21, 0.4);
        }

        .retro-btn {
            background: #2563eb;
            color: #ffffff;
            border: 2px solid #93c5fd;
            box-shadow: 0 4px 0 #1e3a8a, 0 0 0 2px #000;
            font-family: 'Press Start 2P', monospace;
            transition: transform 0.05s;
            cursor: pointer;
            touch-action: manipulation;
        }
        .retro-btn:hover {
            filter: brightness(1.1);
        }
        .retro-btn:active, .retro-btn.pressed {
            transform: translateY(3px);
            box-shadow: 0 1px 0 #1e3a8a, 0 0 0 2px #000;
        }
        .retro-btn:disabled {
            opacity: 0.55;
            cursor: not-allowed;
        }

        .retro-btn-amber {
            background: #d97706;
            border-color: #fde047;
            box-shadow: 0 4px 0 #78350f, 0 0 0 2px #000;
        }
        .retro-btn-amber:active, .retro-btn-amber.pressed {
            box-shadow: 0 1px 0 #78350f, 0 0 0 2px #000;
        }

        .retro-btn-green {
            background: #16a34a;
            border-color: #86efac;
            box-shadow: 0 4px 0 #14532d, 0 0 0 2px #000;
        }
        .retro-btn-green:active, .retro-btn-green.pressed {
            box-shadow: 0 1px 0 #14532d, 0 0 0 2px #000;
        }

        .retro-btn-red {
            background: #dc2626;
            border-color: #fca5a5;
            box-shadow: 0 4px 0 #7f1d1d, 0 0 0 2px #000;
        }
        .retro-btn-red:active, .retro-btn-red.pressed {
            box-shadow: 0 1px 0 #7f1d1d, 0 0 0 2px #000;
        }

        .retro-btn-slate {
            background: #334155;
            border-color: #94a3b8;
            box-shadow: 0 4px 0 #0f172a, 0 0 0 2px #000;
        }

        /* ===== LAYOUT DA PARTIDA: CABE 100% TANTO EM PÉ QUANTO DEITADO ===== */
        body.in-game {
            padding: 0 !important;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #05050a;
        }

        body.in-game #screen-game {
            width: 100%;
            height: 100%;
            max-width: none;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        /* Wrapper do Mapa 21x21 (504x540 com HUD de 36px) */
        #canvas-wrapper {
            position: relative;
            aspect-ratio: 504 / 540;
            background: #000;
            border: 3px solid #334155;
            box-shadow: 0 0 0 3px #000, 0 10px 30px rgba(0,0,0,0.9);
            overflow: hidden;
            width: min(98vw, calc(96dvh * 504 / 540));
            height: auto;
        }

        #gameCanvas, .pixel-canvas {
            image-rendering: -moz-crisp-edges;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: pixelated;
        }

        #gameCanvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .crt-scanlines {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(255, 255, 255, 0),
                rgba(255, 255, 255, 0) 50%,
                rgba(0, 0, 0, 0.20) 50%,
                rgba(0, 0, 0, 0.20)
            );
            background-size: 100% 4px;
            pointer-events: none;
            z-index: 15;
        }

        /* ===== Controles Touch de Resposta Instantânea ===== */
        #touch-controls {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 40;
            pointer-events: none;
            touch-action: none;
        }

        #joy-base {
            position: absolute;
            width: 146px;
            height: 146px;
            border-radius: 50%;
            background: rgba(10, 30, 90, 0.35);
            border: 4px solid rgba(59, 130, 246, 0.75);
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #joy-base.active {
            background: rgba(15, 45, 130, 0.55);
            border-color: #60a5fa;
        }
        #joy-knob {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 30%, #60a5fa 0%, #2563eb 55%, #1d4ed8 100%);
            border: 3px solid #93c5fd;
            box-shadow: 0 4px 0 #0a3d91;
            display: flex;
            align-items: center;
            justify-content: center;
            will-change: transform;
            pointer-events: none;
        }

        #atk-zone {
            position: absolute;
            width: 132px;
            height: 132px;
            pointer-events: none;
        }
        #btn-touch-bomb {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid rgba(239, 68, 68, 0.8);
            background: rgba(127, 29, 29, 0.32);
            padding: 0;
            pointer-events: auto;
            touch-action: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .atk-core {
            width: 94px;
            height: 94px;
            border-radius: 50%;
            background: radial-gradient(circle at 38% 30%, #ff7a6b 0%, #ef4435 45%, #c92a1e 100%);
            border: 3px solid #fca5a5;
            box-shadow: 0 5px 0 #6b150f;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        #btn-touch-bomb.pressed .atk-core {
            transform: translateY(3px);
            box-shadow: 0 2px 0 #6b150f;
        }

        @media (pointer: coarse), (max-width: 920px) {
            #touch-controls { display: block; }
        }

        /* MODO VERTICAL (EM PÉ): Mapa inteiro no topo + controles na área inferior */
        @media (orientation: portrait) and (pointer: coarse), (orientation: portrait) and (max-width: 920px) {
            body.in-game #screen-game {
                flex-direction: column;
                justify-content: flex-start;
                padding-top: max(6px, env(safe-area-inset-top));
                padding-bottom: 185px;
            }
            body.in-game #canvas-wrapper {
                width: min(98vw, calc((100dvh - 195px) * 504 / 540));
            }
            #joy-base {
                left: max(16px, env(safe-area-inset-left));
                bottom: calc(16px + env(safe-area-inset-bottom));
            }
            #atk-zone {
                right: max(16px, env(safe-area-inset-right));
                bottom: calc(22px + env(safe-area-inset-bottom));
            }
        }

        /* MODO HORIZONTAL (DEITADO): Mapa centralizado ocupando 96% da altura da tela e controles nas laterais */
        @media (orientation: landscape) and (pointer: coarse), (orientation: landscape) and (max-width: 920px) {
            body.in-game #screen-game {
                flex-direction: row;
                justify-content: center;
                align-items: center;
            }
            body.in-game #canvas-wrapper {
                height: 96dvh;
                width: calc(96dvh * 504 / 540);
                max-width: calc(100vw - 240px);
                max-height: calc((100vw - 240px) * 540 / 504);
            }
            #joy-base {
                left: max(14px, env(safe-area-inset-left));
                bottom: max(16px, env(safe-area-inset-bottom));
                width: 132px;
                height: 132px;
            }
            #joy-knob {
                width: 70px;
                height: 70px;
            }
            #atk-zone {
                right: max(14px, env(safe-area-inset-right));
                bottom: max(20px, env(safe-area-inset-bottom));
                width: 122px;
                height: 122px;
            }
            .atk-core {
                width: 86px;
                height: 86px;
            }
        }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #090812; }
        ::-webkit-scrollbar-thumb { background: #f59e0b; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-1.5 sm:p-3">

    <!-- ========================================================================= -->
    <!-- TELA 1: AUTENTICAÇÃO (SEM FAIXA AMARELA ACIMA DO TÍTULO)                  -->
    <!-- ========================================================================= -->
    <section id="screen-auth" class="w-full max-w-[480px] retro-panel p-4 sm:p-6 my-auto">
        <div class="text-center mb-4">
            <h1 class="text-base sm:text-xl text-yellow-300 drop-shadow-[2px_2px_0_#000] leading-snug">
                TINY BOMB<br><span class="text-red-500">PIXEL ARENA</span>
            </h1>
        </div>

        <div class="retro-subpanel p-3 border-2 border-emerald-500/60">
            <div class="flex gap-2">
                <input id="quick-nickname" type="text" maxlength="10" placeholder="SEU APELIDO" class="retro-input w-full uppercase">
                <button id="btn-quick-play" type="button" class="retro-btn retro-btn-green px-3 py-2 text-[8px] shrink-0">
                    JOGAR ▶
                </button>
            </div>
        </div>
    </section>

    <!-- ========================================================================= -->
    <!-- TELA 2: SALAS (TEXTOS LIMPOS CONFORME SOLICITADO)                         -->
    <!-- ========================================================================= -->
    <section id="screen-home" class="hidden w-full max-w-[660px] retro-panel p-4 sm:p-5 my-auto">

            <div>
                <h2 class="text-xs sm:text-sm text-yellow-300">SALAS</h2>
            </div>
            <div class="flex items-center gap-2">
                <label class="text-[8px] text-amber-300">APELIDO:</label>
                <input id="home-nickname" type="text" maxlength="10" class="retro-input w-28 py-1 px-2 text-[9px] uppercase">
            </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            <div class="retro-subpanel p-3.5 flex flex-col justify-between gap-4">
                <div>
                    <h3 class="text-[10px] text-amber-400 mb-3">CRIAR NOVA SALA</h3>
                    <button id="btn-create-room" class="retro-btn retro-btn-green w-full py-3 text-[10px]">
                        + CRIAR SALA AGORA

                </div>

                    <h3 class="text-[10px] text-sky-400 mb-2">DIGITAR CÓDIGO DA SALA</h3>
                    <div class="flex gap-2">

                        <button id="btn-join-code" class="retro-btn retro-btn-amber px-4 text-[9px]">ENTRAR</button>

                </div>
            </div>

            <div class="retro-subpanel p-3.5 flex flex-col">
                <div class="flex items-center justify-between mb-2">
                    <h3 class="text-[10px] text-emerald-400">SALAS ABERTAS AGORA</h3>
                    <span class="text-[7px] text-slate-400">TOQUE PARA ENTRAR</span>

                <div id="open-rooms-list" class="flex-1 min-h-[150px] max-h-[190px] overflow-y-auto flex flex-col gap-2 pr-1">
                    <div class="text-[8px] text-slate-500 text-center py-10">PROCURANDO SALAS NO SERVIDOR...</div>
                </div>
            </div>
        </div>

        <div id="home-error" class="hidden mt-3 p-2 bg-red-950/80 border border-red-500 text-red-200 text-[8px] text-center"></div>
    </section>

    <!-- ========================================================================= -->
    <!-- TELA 3: LOBBY DA SALA (CAMPANHA, PVP TODOS CONTRA TODOS E PVP DUPLAS 2V2) -->
    <!-- ========================================================================= -->
    <section id="screen-lobby" class="hidden w-full max-w-[760px] retro-panel p-3 sm:p-5 my-auto">
        <div class="flex flex-wrap items-center justify-between gap-2 pb-3 mb-3 border-b-2 border-slate-800">
            <div class="flex items-center gap-3">
                <div class="bg-black border-2 border-yellow-400 px-3 py-1.5">

        <div class="retro-subpanel p-3 mb-3">

                </button>
                <button data-mode="COMBAT" class="mode-btn retro-btn py-2.5 px-2 text-[8px] leading-relaxed">

            <div class="flex flex-wrap items-center justify-between gap-2 pt-2 border-t border-slate-800">

                </div>

                    BOTS NAS VAGAS: ON
                </button>
            </div>
        </div>

        <div class="mb-3">
            <div id="lobby-slots-grid" class="grid grid-cols-2 sm:grid-cols-4 gap-2"></div>
        </div>

        <div class="flex flex-col sm:flex-row items-center justify-between gap-2">

            <button id="btn-start-match" class="retro-btn retro-btn-green w-full sm:w-auto px-6 py-3 text-[10px]">
                ▶ INICIAR PARTIDA AGORA
            </button>
        </div>
    </section>

    <!-- ========================================================================= -->
    <!-- TELA 4: PARTIDA EM ANDAMENTO (ARENA 21x21)                                -->
    <!-- ========================================================================= -->
    <section id="screen-game" class="hidden w-full flex-col items-center">
        <div id="canvas-wrapper">
            <canvas id="gameCanvas" width="504" height="540"></canvas>
            <div class="crt-scanlines"></div>

            <!-- OVERLAY DE FIM DE PARTIDA / PRÓXIMA FASE -->
            <div id="match-over-overlay" class="hidden absolute inset-0 bg-black/85 z-30 flex flex-col items-center justify-center p-4 text-center">

                    <p id="over-subtitle" class="text-[8px] text-emerald-300 mb-4 leading-relaxed"></p>

                    <div class="flex flex-col gap-2">
                        <button id="btn-back-to-lobby" class="retro-btn retro-btn-green py-3 text-[9px] w-full">
                            ↩ VOLTAR PARA A SALA
                        </button>
                        <button id="btn-rematch-now" class="retro-btn retro-btn-amber py-2.5 text-[8px] w-full">
                            🔄 JOGAR NOVAMENTE MESMA SALA

                </div>
            </div>

        <!-- CONTROLES TOUCH ZERO-LAG (4 DIREÇÕES PURAS) -->

                            <circle cx="50" cy="8" r="4" fill="#fde047"/>

    </section>

        /**
         * ============================================================================
         * 4. SINTETIZADOR DE ÁUDIO 16-BIT
         * ============================================================================
         */
        class RetroAudio {
            constructor() {
                this.ctx = null;
                this.enabled = true;
            }
            init() {
                if (!this.ctx) {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (AudioCtx) this.ctx = new AudioCtx();
                }
                if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
            }
            tone(freq, dur, type = 'square', vol = 0.10, delay = 0) {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const t = this.ctx.currentTime + delay;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, t);
                gain.gain.setValueAtTime(vol, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + dur);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(t);
                osc.stop(t + dur + 0.01);
            }
            blip() { this.tone(680, 0.04, 'square', 0.08); }
            select() {
                this.tone(523.25, 0.06, 'square', 0.10, 0);
                this.tone(1046.5, 0.10, 'square', 0.10, 0.06);
            }
            bomb() {
                this.tone(240, 0.05, 'triangle', 0.15, 0);
                this.tone(150, 0.07, 'square', 0.10, 0.04);
            }
            horseNeigh() {
                [440, 587.33, 659.25, 880, 659.25].forEach((f, i) =>
                    this.tone(f, 0.06, 'triangle', 0.14, i * 0.045)
                );
            }
            powerup() {
                [587.33, 783.99, 987.77, 1174.66].forEach((f, i) => this.tone(f, 0.06, 'square', 0.10, i * 0.05));
            }
            explosion() {
                if (!this.enabled) return;
                this.init();
                if (!this.ctx) return;
                const now = this.ctx.currentTime;
                const len = this.ctx.sampleRate * 0.32;
                const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
                const data = buf.getChannelData(0);
                for (let i = 0; i < len; i++) {
                    const step = Math.floor(i / 6) * 6;
                    data[i] = ((Math.sin(step * 14.3) > 0 ? 1 : -1) * Math.random()) * Math.exp(-i / (this.ctx.sampleRate * 0.10));
                }
                const noise = this.ctx.createBufferSource();
                noise.buffer = buf;
                const filter = this.ctx.createBiquadFilter();
                filter.type = 'lowpass';
                filter.frequency.setValueAtTime(560, now);
                filter.frequency.exponentialRampToValueAtTime(75, now + 0.30);
                const gain = this.ctx.createGain();
                gain.gain.setValueAtTime(0.32, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.31);
                noise.connect(filter);
                filter.connect(gain);
                gain.connect(this.ctx.destination);
                noise.start(now);
            }
            win() {
                [523.25, 659.25, 783.99, 1046.5, 783.99, 1046.5].forEach((f, i) =>
                    this.tone(f, 0.12, 'square', 0.12, [0, 0.1, 0.2, 0.3, 0.44, 0.56][i])
                );
            }
        }
        const sfx = new RetroAudio();

            ctx.fillRect(3, 6 + bob, 3, 4 - (legSwing > 0 ? 1 : 0));
            ctx.fillRect(6, 6 + bob, 3, 4 + (legSwing > 0 ? 1 : 0));
            ctx.fillStyle = '#1c1917';
            ctx.fillRect(-8, 9 + bob, 3, 2);

            ctx.fillStyle = '#facc15';
            ctx.fillRect(-12, -1 + bob, 4, 3);

            ctx.fillRect(-8, -1 + bob, 16, 7);

            ctx.fillStyle = '#dc2626';
            ctx.fillRect(-3, -2 + bob, 6, 4);
            ctx.fillStyle = '#fde047';

        function drawBomberSprite(ctx, cx, cy, skin, dir = 'DOWN', animTime = 0, options = {}) {
            const scale = options.scale || 1;
            const step = animTime > 0 ? Math.floor(Math.sin(animTime) * 2.2) : 0;
            const bounce = animTime > 0 ? Math.abs(Math.floor(Math.sin(animTime * 2) * 1.4)) : 0;
            const mounted = !!options.mounted;
            const OUT = '#141018';

            ctx.save();
            ctx.translate(Math.floor(cx), Math.floor(cy));
            ctx.scale(scale, scale);

            if (options.invulnBlink && Math.floor(Date.now() / 60) % 2 === 0) {
                ctx.globalAlpha = 0.45;
            }

            ctx.fillStyle = 'rgba(0,0,0,0.45)';
            ctx.fillRect(-9, 9, 18, 4);

            const riderLift = mounted ? 5 : 0;
            const by = -bounce - riderLift;

            if (mounted) {
                const hBob = bounce;
                const hStep = step;

                ctx.fillStyle = '#141018';
                ctx.fillRect(-10, 0 - hBob, 20, 9);
                ctx.fillStyle = '#b45309';
                ctx.fillRect(-9, 1 - hBob, 18, 7);
                ctx.fillStyle = '#d97706';
                ctx.fillRect(-8, 1 - hBob, 16, 4);

                ctx.fillStyle = '#78350f';
                ctx.fillRect(-9, 7 - hBob, 3, 4 + Math.max(0, hStep));
                ctx.fillRect(-5, 7 - hBob, 3, 4 + Math.max(0, -hStep));
                ctx.fillRect(3, 7 - hBob, 3, 4 + Math.max(0, -hStep));
                ctx.fillRect(6, 7 - hBob, 3, 4 + Math.max(0, hStep));
                ctx.fillStyle = '#141018';
                ctx.fillRect(-9, 10 - hBob + Math.max(0, hStep), 3, 2);
                ctx.fillRect(6, 10 - hBob + Math.max(0, hStep), 3, 2);

                ctx.fillStyle = '#facc15';
                const tailX = dir === 'LEFT' ? 9 : -12;
                ctx.fillRect(tailX, 1 - hBob, 3, 5);

                ctx.fillStyle = '#dc2626';
                ctx.fillRect(-5, 0 - hBob, 10, 4);
                ctx.fillStyle = '#18181b';
                ctx.fillRect(-6, 4 - hBob, 3, 3);
                ctx.fillRect(3, 4 - hBob, 3, 3);
            } else {
                ctx.fillStyle = OUT;
                ctx.fillRect(-6, by + 7 - Math.max(0, step), 5, 4);
                ctx.fillRect(1, by + 7 - Math.max(0, -step), 5, 4);
            }

            ctx.fillStyle = OUT;
            ctx.fillRect(-8, by - 1, 16, 9);
            ctx.fillStyle = skin.main;
            ctx.fillRect(-7, by, 14, 7);
            ctx.fillStyle = skin.dark;
            ctx.fillRect(-7, by + 4, 14, 3);
            ctx.fillStyle = skin.light;
            ctx.fillRect(-6, by, 12, 1);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(-1, by + 2, 2, 2);

            ctx.fillStyle = OUT;
            ctx.fillRect(-10, by + step, 3, 6);
            ctx.fillRect(7, by - step, 3, 6);
            ctx.fillStyle = skin.main;
            ctx.fillRect(-9, by + 1 + step, 2, 3);
            ctx.fillRect(7, by + 1 - step, 2, 3);
            ctx.fillStyle = '#f8fafc';
            ctx.fillRect(-9, by + 4 + step, 2, 2);
            ctx.fillRect(7, by + 4 - step, 2, 2);

            ctx.fillStyle = OUT;
            ctx.fillRect(-8, by - 13, 16, 13);
            ctx.fillRect(-7, by - 14, 14, 1);
            ctx.fillStyle = skin.main;
            ctx.fillRect(-7, by - 13, 14, 12);
            ctx.fillStyle = skin.light;
            ctx.fillRect(-6, by - 13, 8, 2);
            ctx.fillRect(-7, by - 11, 2, 4);
            ctx.fillStyle = skin.dark;
            ctx.fillRect(-7, by - 3, 14, 2);

            if (dir !== 'UP') {
                const shift = dir === 'LEFT' ? -2 : (dir === 'RIGHT' ? 2 : 0);
                ctx.fillStyle = OUT;
                ctx.fillRect(-6 + shift, by - 10, 12, 8);
                ctx.fillStyle = '#fde8d0';
                ctx.fillRect(-5 + shift, by - 9, 10, 6);
                ctx.fillStyle = '#111827';
                ctx.fillRect(-3 + shift, by - 8, 2, 4);
                ctx.fillRect(1 + shift, by - 8, 2, 4);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(-3 + shift, by - 8, 1, 1);
                ctx.fillRect(1 + shift, by - 8, 1, 1);
            }

            ctx.fillStyle = OUT;
            ctx.fillRect(-1, by - 17, 2, 4);
            ctx.fillRect(-3, by - 20, 6, 5);
            ctx.fillStyle = skin.light;
            ctx.fillRect(-2, by - 19, 4, 3);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(-2, by - 19, 1, 1);

            if (mounted) {
                const hBob = bounce;
                const headX = dir === 'LEFT' ? -9 : (dir === 'RIGHT' ? 5 : 0);
                const headY = -3 - hBob;
                ctx.fillStyle = '#141018';
                ctx.fillRect(headX - 3, headY - 5, 8, 8);
                ctx.fillStyle = '#d97706';
                ctx.fillRect(headX - 2, headY - 4, 6, 6);
                ctx.fillStyle = '#fde047';
                ctx.fillRect(headX - 1, headY - 6, 4, 2);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(headX, headY - 3, 2, 2);
                ctx.fillStyle = '#000000';
                ctx.fillRect(headX + 1, headY - 3, 1, 2);
                ctx.fillStyle = '#ef4444';
                ctx.fillRect(headX - 2, headY, 6, 1);
            }

            ctx.restore();
        }

        async function tryLockLandscape(enable) {
            try {
                if (enable && screen.orientation && screen.orientation.lock) {
                    await screen.orientation.lock('landscape');
                } else if (!enable && screen.orientation && screen.orientation.unlock) {
                    screen.orientation.unlock();
                }
            } catch (e) {}
        }

        function showScreen(name) {
            Object.entries(screens).forEach(([k, el]) => {
                if (k === name) {
                    el.classList.remove('hidden');
                    if (k === 'game') el.classList.add('flex');
                } else {
                    el.classList.add('hidden');
                    if (k === 'game') el.classList.remove('flex');
                }
            });
            document.body.classList.toggle('in-game', name === 'game');
            tryLockLandscape(name === 'game');
            if (name !== 'game') window.scrollTo(0, 0);
        }

        function completeUserLogin(uid, email, nickname) {
            const cleanNick = (nickname || email?.split('@')[0] || 'PLAYER')

                .slice(0, 10) || 'PLAYER';

            document.getElementById('home-nickname').value = cleanNick;

            if (db && !isOfflineFallback) {
                db.ref(`users/${uid}`).update({
                    nickname: cleanNick,
                    email: email || '',

                }).catch(() => {});
            }

            showScreen('home');
            subscribeOpenRooms();

                        try {
                            const snap = await db.ref(`users/${user.uid}/nickname`).once('value');
                            if (snap.exists()) savedNick = snap.val();
                        } catch (e) {}
                    }
                    completeUserLogin(user.uid, user.email, savedNick);
                } else {
                    const localSession = localStorage.getItem('tbph_local_session');

        const localRoomsMemory = {};

        function generateRoomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
            let code = '';
            for (let i = 0; i < 4; i++) code += chars[Math.floor(Math.random() * chars.length)];
            return code;

        function subscribeOpenRooms() {
            if (!db || isOfflineFallback) {
                renderOpenRoomsList({});
                return;
            }
            if (openRoomsListenerRef) openRoomsListenerRef.off();
            openRoomsListenerRef = db.ref('rooms').limitToLast(15);
            openRoomsListenerRef.on('value', (snap) => {
                renderOpenRoomsList(snap.val() || {});
            }, () => renderOpenRoomsList(localRoomsMemory));
        }

        function renderOpenRoomsList(roomsObj) {
            const listEl = document.getElementById('open-rooms-list');
            listEl.innerHTML = '';
            const now = Date.now();
            const entries = Object.entries(roomsObj).filter(([, r]) => {
                if (!r || !r.players) return false;
                if (r.updatedAt && now - r.updatedAt > 7200000) return false;
                return true;
            });

            if (entries.length === 0) {
                listEl.innerHTML = `<div class="text-[8px] text-slate-500 text-center py-8 leading-relaxed">NENHUMA SALA ABERTA AGORA.<br>CLIQUE EM "+ CRIAR SALA AGORA"!</div>`;
                return;
            }

            entries.reverse().forEach(([code, r]) => {
                const pCount = Object.keys(r.players || {}).length;
                const isCampaignRoom = r.mode === 'CAMPAIGN';
                const is2v2Room = r.mode === 'COMBAT_2V2';
                const countLabel = isCampaignRoom
                    ? `${pCount}/${MAX_CAMPAIGN_PLAYERS}`
                    : (is2v2Room ? `${pCount}/4` : `${pCount}`);
                const modeLabel = isCampaignRoom
                    ? `🗺️ CAMPANHA NV.${r.campaignLevel || 1}`
                    : (is2v2Room ? '🤝 COMBATE 2V2' : '⚔️ COMBATE');
                const statusLabel = r.status === 'PLAYING' ? 'EM JOGO' : 'NO LOBBY';

                const btn = document.createElement('button');
                btn.className = 'retro-btn retro-btn-slate w-full p-2.5 flex items-center justify-between text-left';
                btn.innerHTML = `
                    <div>
                        <span class="text-[10px] text-yellow-300 font-bold">#${code}</span>
                        <span class="text-[8px] text-slate-300 ml-2">${modeLabel}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="text-[7px] px-1.5 py-0.5 ${r.status === 'PLAYING' ? 'bg-amber-600' : 'bg-emerald-700'}">${statusLabel}</span>
                        <span class="text-[8px] text-amber-300">${countLabel}</span>
                    </div>
                `;
                btn.addEventListener('click', () => joinRoomByCode(code));
                listEl.appendChild(btn);
            });
        }

        async function createNewRoom() {

            sfx.select();
            const code = generateRoomCode();
            const initialRoom = {
                code,
                hostId: currentUser.uid,
                mode: 'CAMPAIGN',
                status: 'LOBBY',
                campaignLevel: 1,
                horseEnabled: true,
                fillBots: true,
                seed: Math.floor(Math.random() * 999999),
                updatedAt: Date.now(),
                players: {
                    [currentUser.uid]: {
                        uid: currentUser.uid,
                        nickname: currentUser.nickname,
                        slot: 0,
                        wins: 0,
                        joinedAt: Date.now()
                    }
                }
            };

            localRoomsMemory[code] = initialRoom;
            if (db && !isOfflineFallback) {
                try {
                    await db.ref(`rooms/${code}`).set(initialRoom);
                    db.ref(`rooms/${code}/players/${currentUser.uid}`).onDisconnect().remove();
                } catch (e) {}
            }
            enterRoomLobby(code);
        }

        async function joinRoomByCode(rawCode) {
            if (!currentUser) return;
            const code = (rawCode || '').trim().toUpperCase();
            const errEl = document.getElementById('home-error');
            errEl.classList.add('hidden');

            if (code.length !== 4) {
                errEl.textContent = 'DIGITE UM CÓDIGO DE SALA DE 4 LETRAS!';
                errEl.classList.remove('hidden');
                return;
            }

            sfx.select();
            let room = localRoomsMemory[code];
            if (db && !isOfflineFallback) {
                try {
                    const snap = await db.ref(`rooms/${code}`).once('value');
                    if (snap.exists()) room = snap.val();
                } catch (e) {}
            }

            if (!room) {
                errEl.textContent = `SALA #${code} NÃO ENCONTRADA!`;
                errEl.classList.remove('hidden');
                return;
            }

            const existingPlayers = room.players || {};
            const maxPlayers = maxPlayersForMode(room.mode);
            if (!existingPlayers[currentUser.uid] && Object.keys(existingPlayers).length >= maxPlayers) {
                errEl.textContent = `A SALA #${code} JÁ ESTÁ CHEIA!`;
                errEl.classList.remove('hidden');
                return;
            }

            const usedSlots = new Set(Object.values(existingPlayers).map(p => p.slot));
            let freeSlot = 0;
            while (usedSlots.has(freeSlot) && freeSlot < MAX_COMBAT_PLAYERS) freeSlot++;

            const myPlayerObj = existingPlayers[currentUser.uid] || {
                uid: currentUser.uid,
                nickname: currentUser.nickname,
                slot: freeSlot,
                wins: 0,
                joinedAt: Date.now()
            };
            myPlayerObj.nickname = currentUser.nickname;

            if (!room.players) room.players = {};
            room.players[currentUser.uid] = myPlayerObj;
            localRoomsMemory[code] = room;

            if (db && !isOfflineFallback) {
                try {
                    await db.ref(`rooms/${code}/players/${currentUser.uid}`).set(myPlayerObj);
                    await db.ref(`rooms/${code}/updatedAt`).set(Date.now());
                    db.ref(`rooms/${code}/players/${currentUser.uid}`).onDisconnect().remove();
                } catch (e) {}
            }

            enterRoomLobby(code);
        }

        function enterRoomLobby(code) {
            currentRoomCode = code;
            document.getElementById('lobby-room-code').textContent = code;
            showScreen('lobby');

            if (roomListenerRef) roomListenerRef.off();
            if (db && !isOfflineFallback) {
                roomListenerRef = db.ref(`rooms/${code}`);
                roomListenerRef.on('value', (snap) => {
                    const data = snap.val();
                    if (!data) {
                        leaveCurrentRoom();
                        return;
                    }
                    handleRoomSnapshotUpdate(data);
                });
            } else {
                handleRoomSnapshotUpdate(localRoomsMemory[code]);
            }
        }

        function leaveCurrentRoom() {
            stopMatchSyncListeners();
            if (roomListenerRef) {

                roomListenerRef = null;
            }
            if (currentRoomCode && currentUser && db && !isOfflineFallback) {
                db.ref(`rooms/${currentRoomCode}/players/${currentUser.uid}`).remove().catch(() => {});

        function handleRoomSnapshotUpdate(data) {
            currentRoomData = data;

                    : '';

                        <div class="text-[8px] ${fillWithBots ? 'text-sky-400' : 'text-slate-500'} my-auto text-center">

            const startBtn = document.getElementById('btn-start-match');

            } else {

            if (data.status === 'PLAYING' && !gameRunning) {

        document.getElementById('btn-create-room').addEventListener('click', createNewRoom);
        document.getElementById('btn-join-code').addEventListener('click', () => {

        document.querySelectorAll('.mode-btn').forEach(btn => {

        document.getElementById('btn-toggle-pvp-horse').addEventListener('click', () => {

        document.getElementById('btn-toggle-bots').addEventListener('click', () => {

            currentRoomData.fillBots = fillWithBots;

        document.getElementById('btn-start-match').addEventListener('click', () => {
            if (!currentRoomData || currentRoomData.hostId !== currentUser.uid) return;
            sfx.select();
            const newSeed = Math.floor(Math.random() * 899999 + 100000);
            currentRoomData.seed = newSeed;

            if (db && !isOfflineFallback) {
                db.ref(`rooms/${currentRoomCode}/match`).remove();
