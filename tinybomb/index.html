        /**
         * ============================================================================
         * 7. ENGINE DA PARTIDA: ZERO DIAGONAL + SUPORTE A DUPLAS 2V2
         * ============================================================================
         */
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        ctx.imageSmoothingEnabled = false;

        const COLS = 21;
        const ROWS = 21;
        const TILE_SIZE = 24;
        const HUD_HEIGHT = 36;
        const TILE = { EMPTY: 0, WALL: 1, BRICK: 2 };
        const DIRS = [
            { name: 'UP', dr: -1, dc: 0 },
            { name: 'DOWN', dr: 1, dc: 0 },
            { name: 'LEFT', dr: 0, dc: -1 },
            { name: 'RIGHT', dr: 0, dc: 1 }
        ];

        let gameRunning = false;
        let matchFinished = false;
        let gameClock = 0;
        let matchTimer = 180;
        let screenShake = 0;
        let currentStageInfo = CAMPAIGN_STAGES[0];
        let currentBiome = BIOMES[0];
        let floatingNotice = null;

        let grid = [];
        let hiddenItems = [];
        let hiddenHorsePos = null;
        let horseEntity = null;
        let items = [];
        let bombs = [];
        let explosions = [];
        let fighters = [];
        let monsters = [];
        let portalTile = null;
        let localFighter = null;
        let lastNetSync = 0;

        function createSeededRandom(seed) {
            let s = seed % 2147483647;
            if (s <= 0) s += 2147483646;
            return function() {
                s = (s * 16807) % 2147483647;
                return (s - 1) / 2147483646;
            };
        }

        const SPAWN_POINTS = [
            { r: 1, c: 1 },
            { r: ROWS - 2, c: COLS - 2 },
            { r: 1, c: COLS - 2 },
            { r: ROWS - 2, c: 1 },
            { r: 1, c: 10 },
            { r: ROWS - 2, c: 10 },
            { r: 10, c: 1 },
            { r: 10, c: COLS - 2 },
            { r: 7, c: 7 },
            { r: 13, c: 13 }
        ];

        const isOpenPattern = (r, c) =>
            r >= 1 && r <= ROWS - 2 && c >= 1 && c <= COLS - 2 && !(r % 2 === 0 && c % 2 === 0);

        function buildSafeSet(mode) {
            const set = new Set();
            if (mode === 'CAMPAIGN') {
                for (let i = 0; i < 4; i++) {
                    const sp = SPAWN_POINTS[i];
                    set.add(`${sp.r},${sp.c}`);
                    for (const d of DIRS) {
                        if (isOpenPattern(sp.r + d.dr, sp.c + d.dc)) set.add(`${sp.r + d.dr},${sp.c + d.dc}`);
                    }
                }
                return set;
            }
            for (const sp of SPAWN_POINTS) {
                for (let dr = -2; dr <= 2; dr++) {
                    for (let dc = -2; dc <= 2; dc++) {
                        if (Math.abs(dr) + Math.abs(dc) > 2) continue;
                        if (isOpenPattern(sp.r + dr, sp.c + dc)) set.add(`${sp.r + dr},${sp.c + dc}`);
                    }
                }
            }
            return set;
        }

        function startMatchFromRoom(roomData) {
            gameRunning = true;
            matchFinished = false;
            document.getElementById('match-over-overlay').classList.add('hidden');
            showScreen('game');
            sfx.select();

            const rand = createSeededRandom(roomData.seed || 12345);
            const mode = roomData.mode || 'CAMPAIGN';
            const campIdx = Math.min(19, Math.max(0, (roomData.campaignLevel || 1) - 1));
            currentStageInfo = CAMPAIGN_STAGES[campIdx];
            currentBiome = mode === 'CAMPAIGN'
                ? BIOMES[currentStageInfo.biome]
                : BIOMES[(roomData.seed || 0) % BIOMES.length];

            grid = [];
            hiddenItems = [];
            hiddenHorsePos = null;
            horseEntity = null;
            items = [];
            bombs = [];
            explosions = [];
            fighters = [];
            monsters = [];
            portalTile = null;
            floatingNotice = null;
            matchTimer = mode === 'CAMPAIGN' ? 210 : 160;

            const safeSet = buildSafeSet(mode);
            const brickCandidates = [];

            for (let r = 0; r < ROWS; r++) {
                grid[r] = [];
                hiddenItems[r] = [];
                for (let c = 0; c < COLS; c++) {
                    hiddenItems[r][c] = null;
                    if (r === 0 || r === ROWS - 1 || c === 0 || c === COLS - 1 || (r % 2 === 0 && c % 2 === 0)) {
                        grid[r][c] = TILE.WALL;
                    } else if (!safeSet.has(`${r},${c}`) && rand() < (mode === 'CAMPAIGN' ? 0.48 : 0.62)) {
                        grid[r][c] = TILE.BRICK;
                        brickCandidates.push({ r, c });
                        if (rand() < 0.28) {
                            const rv = rand();
                            hiddenItems[r][c] = rv < 0.38 ? 'BOMB' : (rv < 0.76 ? 'FIRE' : 'SPEED');
                        }
                    } else {
                        grid[r][c] = TILE.EMPTY;
                    }
                }
            }

            const shouldSpawnHiddenHorse = mode === 'CAMPAIGN'
                ? !!currentStageInfo.hasHorse
                : (roomData.horseEnabled !== false);

            if (shouldSpawnHiddenHorse && brickCandidates.length > 2) {
                const pickIdx = Math.floor(rand() * brickCandidates.length);
                const chosenBrick = brickCandidates.splice(pickIdx, 1)[0];
                hiddenHorsePos = { r: chosenBrick.r, c: chosenBrick.c };
                hiddenItems[chosenBrick.r][chosenBrick.c] = null;
            }

            if (mode === 'CAMPAIGN') {
                const portalPos = brickCandidates.length > 0
                    ? brickCandidates[Math.floor(rand() * brickCandidates.length)]
                    : { r: 10, c: 10 };
                portalTile = { r: portalPos.r, c: portalPos.c, open: false };

                const emptyCells = [];
                for (let r = 1; r < ROWS - 1; r++) {
                    for (let c = 1; c < COLS - 1; c++) {
                        if (grid[r][c] === TILE.EMPTY && (r > 4 || c > 4)) {
                            emptyCells.push({ r, c });
                        }
                    }
                }

                let mId = 1;
                currentStageInfo.monsters.forEach(group => {
                    for (let i = 0; i < group.count; i++) {
                        const cell = emptyCells.length > 0
                            ? emptyCells[Math.floor(rand() * emptyCells.length)]
                            : { r: 10, c: 11 };
                        const isBoss = group.type.startsWith('BOSS');
                        monsters.push({
                            id: 'm_' + (mId++),
                            type: group.type,
                            isBoss,
                            x: (cell.c + 0.5) * TILE_SIZE,
                            y: (cell.r + 0.5) * TILE_SIZE,
                            dir: DIRS[Math.floor(rand() * 4)],
                            hp: isBoss ? 4 : (group.type === 'GOLEM' || group.type === 'KNIGHT' ? 2 : 1),
                            maxHp: isBoss ? 4 : (group.type === 'GOLEM' || group.type === 'KNIGHT' ? 2 : 1),
                            invulnTimer: 0,
                            alive: true,
                            speed: group.type === 'SLIME' ? 34 : (group.type === 'BAT' ? 54 : (group.type === 'KNIGHT' ? 50 : 44))
                        });
                    }
                });
            }

            const playersList = Object.values(roomData.players || {})
                .sort((a, b) => (a.slot ?? 0) - (b.slot ?? 0) || (a.joinedAt ?? 0) - (b.joinedAt ?? 0))
                .slice(0, maxPlayersForMode(mode));

            playersList.forEach((pData, idx) => {
                const spawn = SPAWN_POINTS[idx];
                const f = createFighter({
                    id: pData.uid,
                    nickname: pData.nickname,
                    skin: skinForSlot(idx),
                    slot: idx,
                    team: teamForSlotInMode(mode, idx),
                    isAI: false,
                    isRemote: pData.uid !== currentUser.uid,
                    spawnR: spawn.r,
                    spawnC: spawn.c
                });
                fighters.push(f);
                if (pData.uid === currentUser.uid) localFighter = f;
            });

            if (roomData.fillBots !== false) {
                const targetCount = mode === 'CAMPAIGN'
                    ? (playersList.length === 1 ? MAX_CAMPAIGN_PLAYERS : playersList.length)
                    : mode === 'COMBAT_2V2'
                        ? MAX_2V2_PLAYERS
                        : Math.min(MAX_COMBAT_PLAYERS, Math.max(MIN_COMBAT_FIGHTERS, playersList.length));

                for (let idx = playersList.length; idx < targetCount; idx++) {
                    const spawn = SPAWN_POINTS[idx];
                    fighters.push(createFighter({
                        id: 'bot_' + idx,
                        nickname: 'CPU ' + (idx + 1),
                        skin: skinForSlot(idx),
                        slot: idx,
                        team: teamForSlotInMode(mode, idx),
                        isAI: true,
                        isRemote: false,
                        spawnR: spawn.r,
                        spawnC: spawn.c
                    }));
                }
            }

            setupRealtimeMatchListeners();

            if (!window.matchMedia('(pointer: coarse)').matches) {
                floatingNotice = { text: 'WASD MOVE • ESPAÇO BOMBA • ESC SALA', timer: 4.5 };
            }
        }

        function createFighter(cfg) {
            return {
                id: cfg.id,
                nickname: cfg.nickname,
                skin: cfg.skin,
                slot: cfg.slot,
                team: cfg.team,
                isAI: cfg.isAI,
                isRemote: cfg.isRemote,
                x: (cfg.spawnC + 0.5) * TILE_SIZE,
                y: (cfg.spawnR + 0.5) * TILE_SIZE,
                dir: 'DOWN',
                isMoving: false,
                animTime: 0,
                alive: true,
                mounted: false,
                invulnTimer: 0,
                maxBombs: 1,
                activeBombs: 0,
                fireRange: 2,
                speedLevel: 1,
                ignoreBombs: new Set(),
                aiTarget: null,
                aiThink: 0,
                aiBombCd: 0
            };
        }

        function applyHitToFighter(f) {
            if (!f || !f.alive || f.invulnTimer > 0) return;
            if (f.mounted) {
                f.mounted = false;
                f.invulnTimer = 1.3;
                sfx.horseNeigh();
                floatingNotice = { text: `${f.nickname} PERDEU O CAVALO!`, timer: 1.6 };
            } else {
                f.alive = false;
                checkMatchOutcome();
            }
        }

        function setupRealtimeMatchListeners() {
            stopMatchSyncListeners();
            if (!db || isOfflineFallback || !currentRoomCode) return;

            const matchRef = db.ref(`rooms/${currentRoomCode}/match`);
            matchStateListenerRef = matchRef;

            const handlePosSnap = (snap) => {
                const d = snap.val();
                if (!d || d.uid === currentUser.uid) return;
                const f = fighters.find(x => x.id === d.uid);
                if (f) {
                    f.x = d.x;
                    f.y = d.y;
                    f.dir = d.dir || f.dir;
                    f.isMoving = !!d.isMoving;
                    f.alive = d.alive !== false;
                    f.mounted = !!d.mounted;
                    if (f.isMoving) f.animTime += 0.35;
                }
            };

            matchRef.child('positions').on('child_added', handlePosSnap);
            matchRef.child('positions').on('child_changed', handlePosSnap);

            matchRef.child('events').on('child_added', (snap) => {
                const ev = snap.val();
                if (!ev || ev.sender === currentUser.uid) return;
                const owner = fighters.find(x => x.id === ev.ownerId);
                if (ev.type === 'BOMB') {
                    spawnBombAt(ev.r, ev.c, ev.range, owner, false);
                } else if (ev.type === 'MATCH_OVER' && !matchFinished) {
                    showMatchOverModal(ev.badge, ev.title, ev.subtitle, ev.nextCampaignLevel);
                }
            });
        }

        function stopMatchSyncListeners() {
            if (matchStateListenerRef) {
                matchStateListenerRef.child('positions').off();
                matchStateListenerRef.child('events').off();
                matchStateListenerRef = null;
            }
        }

        function broadcastMatchEvent(payload) {
            if (!db || isOfflineFallback || !currentRoomCode || !currentUser) return;
            db.ref(`rooms/${currentRoomCode}/match/events`).push({
                ...payload,
                sender: currentUser.uid,
                ts: Date.now()
            }).catch(() => {});
        }

        function isTileSolidForFighter(r, c, f) {
            if (r < 0 || r >= ROWS || c < 0 || c >= COLS) return true;
            if (grid[r][c] !== TILE.EMPTY) return true;
            const bomb = bombs.find(b => b.r === r && b.c === c);
            if (bomb) {
                if (f && f.ignoreBombs.has(bomb)) return false;
                return true;
            }
            return false;
        }

        // MOVIMENTAÇÃO 100% ORTOGONAL (ZERO DIAGONAL)
        function moveFighter(f, rawDx, rawDy, dt) {
            if (!f.alive) return;

            if (rawDx === 0 && rawDy === 0) {
                f.isMoving = false;
                return;
            }

            let dx = 0;
            let dy = 0;
            if (Math.abs(rawDx) > Math.abs(rawDy)) {
                dx = Math.sign(rawDx);
                dy = 0;
            } else {
                dx = 0;
                dy = Math.sign(rawDy);
            }

            f.isMoving = true;
            f.animTime += dt * 12;

            if (dx !== 0) f.dir = dx > 0 ? 'RIGHT' : 'LEFT';
            else f.dir = dy > 0 ? 'DOWN' : 'UP';

            let speed = 82 + (f.speedLevel - 1) * 13;
            if (f.mounted) speed *= 1.18;

            const rad = 8.0;
            const snapSpeed = speed * 1.35;

            if (dx !== 0) {
                const curR = Math.floor(f.y / TILE_SIZE);
                const centerY = (curR + 0.5) * TILE_SIZE;
                const nx = f.x + dx * speed * dt;
                const checkC = Math.floor((nx + dx * rad) / TILE_SIZE);
                const topR = Math.floor((f.y - rad + 1.5) / TILE_SIZE);
                const botR = Math.floor((f.y + rad - 1.5) / TILE_SIZE);

                const topHit = isTileSolidForFighter(topR, checkC, f);
                const botHit = isTileSolidForFighter(botR, checkC, f);

                if (!topHit && !botHit) {
                    f.x = nx;
                    const diffY = centerY - f.y;
                    if (Math.abs(diffY) > 0.2) {
                        f.y += Math.sign(diffY) * Math.min(Math.abs(diffY), snapSpeed * dt);
                    } else {
                        f.y = centerY;
                    }
                } else {
                    if (!isTileSolidForFighter(curR, checkC, f)) {
                        const diffY = centerY - f.y;
                        f.y += Math.sign(diffY) * Math.min(Math.abs(diffY), snapSpeed * dt);
                    }
                    if (dx > 0) f.x = Math.min(f.x, checkC * TILE_SIZE - rad - 0.1);
                    else f.x = Math.max(f.x, (checkC + 1) * TILE_SIZE + rad + 0.1);
                }
            } else if (dy !== 0) {
                const curC = Math.floor(f.x / TILE_SIZE);
                const centerX = (curC + 0.5) * TILE_SIZE;
                const ny = f.y + dy * speed * dt;
                const checkR = Math.floor((ny + dy * rad) / TILE_SIZE);
                const leftC = Math.floor((f.x - rad + 1.5) / TILE_SIZE);
                const rightC = Math.floor((f.x + rad - 1.5) / TILE_SIZE);

                const leftHit = isTileSolidForFighter(checkR, leftC, f);
                const rightHit = isTileSolidForFighter(checkR, rightC, f);

                if (!leftHit && !rightHit) {
                    f.y = ny;
                    const diffX = centerX - f.x;
                    if (Math.abs(diffX) > 0.2) {
                        f.x += Math.sign(diffX) * Math.min(Math.abs(diffX), snapSpeed * dt);
                    } else {
                        f.x = centerX;
                    }
                } else {
                    if (!isTileSolidForFighter(checkR, curC, f)) {
                        const diffX = centerX - f.x;
                        f.x += Math.sign(diffX) * Math.min(Math.abs(diffX), snapSpeed * dt);
                    }
                    if (dy > 0) f.y = Math.min(f.y, checkR * TILE_SIZE - rad - 0.1);
                    else f.y = Math.max(f.y, (checkR + 1) * TILE_SIZE + rad + 0.1);
                }
            }

            for (const b of f.ignoreBombs) {
                if (
                    f.x + rad <= b.c * TILE_SIZE ||
                    f.x - rad >= (b.c + 1) * TILE_SIZE ||
                    f.y + rad <= b.r * TILE_SIZE ||
                    f.y - rad >= (b.r + 1) * TILE_SIZE
                ) {
                    f.ignoreBombs.delete(b);
                }
            }

            const r = Math.floor(f.y / TILE_SIZE);
            const c = Math.floor(f.x / TILE_SIZE);

            if (horseEntity && !horseEntity.collected && !f.mounted && r === horseEntity.r && c === horseEntity.c) {
                horseEntity.collected = true;
                f.mounted = true;
                sfx.horseNeigh();
                floatingNotice = { text: `🐴 ${f.nickname} MONTOU NO CAVALO! (+1 VIDA)`, timer: 2.0 };
            }

            for (let i = items.length - 1; i >= 0; i--) {
                if (items[i].r === r && items[i].c === c) {
                    const it = items[i];
                    if (it.type === 'BOMB') f.maxBombs = Math.min(6, f.maxBombs + 1);
                    if (it.type === 'FIRE') f.fireRange = Math.min(6, f.fireRange + 1);
                    if (it.type === 'SPEED') f.speedLevel = Math.min(4, f.speedLevel + 1);
                    sfx.powerup();
                    items.splice(i, 1);
                }
            }

            if (portalTile && portalTile.open && r === portalTile.r && c === portalTile.c && !matchFinished) {
                advanceOrBeatCampaign();
            }
        }

        function triggerPlantBomb(f) {
            if (!f || !f.alive || f.activeBombs >= f.maxBombs) return null;
            const r = Math.floor(f.y / TILE_SIZE);
            const c = Math.floor(f.x / TILE_SIZE);
            return spawnBombAt(r, c, f.fireRange, f, true);
        }

        function spawnBombAt(r, c, range, owner, broadcast = false) {
            if (grid[r]?.[c] !== TILE.EMPTY) return null;
            if (bombs.some(b => b.r === r && b.c === c)) return null;

            const bomb = {
                r,
                c,
                range: range || 2,
                owner,
                timer: 2.6
            };

            if (owner) owner.activeBombs++;
            fighters.forEach(p => {
                if (!p.alive) return;
                const pr = Math.floor(p.y / TILE_SIZE);
                const pc = Math.floor(p.x / TILE_SIZE);
                if (pr === r && pc === c) p.ignoreBombs.add(bomb);
            });

            bombs.push(bomb);
            sfx.bomb();

            if (broadcast && owner) {
                broadcastMatchEvent({ type: 'BOMB', r, c, range: bomb.range, ownerId: owner.id });
            }
            return bomb;
        }

        function explodeBomb(bomb) {
            const idx = bombs.indexOf(bomb);
            if (idx === -1) return;
            bombs.splice(idx, 1);
            if (bomb.owner) bomb.owner.activeBombs = Math.max(0, bomb.owner.activeBombs - 1);
            fighters.forEach(p => p.ignoreBombs.delete(bomb));

            sfx.explosion();
            screenShake = 4;

            explosions.push({ r: bomb.r, c: bomb.c, timer: 0.42 });
            const chain = [];

            for (const d of DIRS) {
                for (let s = 1; s <= bomb.range; s++) {
                    const nr = bomb.r + d.dr * s;
                    const nc = bomb.c + d.dc * s;
                    if (nr < 0 || nr >= ROWS || nc < 0 || nc >= COLS) break;
                    if (grid[nr][nc] === TILE.WALL) break;

                    if (grid[nr][nc] === TILE.BRICK) {
                        grid[nr][nc] = TILE.EMPTY;

                        if (hiddenHorsePos && hiddenHorsePos.r === nr && hiddenHorsePos.c === nc) {
                            horseEntity = { r: nr, c: nc, collected: false };
                            hiddenHorsePos = null;
                            sfx.horseNeigh();
                            floatingNotice = { text: '🐴 UM CAVALINHO APARECEU NO MAPA!', timer: 2.2 };
                        } else if (hiddenItems[nr][nc]) {
                            items.push({ r: nr, c: nc, type: hiddenItems[nr][nc] });
                            hiddenItems[nr][nc] = null;
                        }

                        explosions.push({ r: nr, c: nc, timer: 0.42 });
                        break;
                    }

                    const otherBomb = bombs.find(ob => ob.r === nr && ob.c === nc);
                    if (otherBomb) chain.push(otherBomb);

                    explosions.push({ r: nr, c: nc, timer: 0.42 });
                }
            }

            chain.forEach(cb => {
                if (bombs.includes(cb)) cb.timer = Math.min(cb.timer, 0.04);
            });
        }

        function updateBotAI(bot, dt) {
            if (!bot.alive) return;
            bot.aiThink -= dt;
            bot.aiBombCd = Math.max(0, bot.aiBombCd - dt);

            const r = Math.floor(bot.y / TILE_SIZE);
            const c = Math.floor(bot.x / TILE_SIZE);

            const inDanger = (tr, tc) => bombs.some(b =>
                (b.r === tr && Math.abs(b.c - tc) <= b.range) ||
                (b.c === tc && Math.abs(b.r - tr) <= b.range)
            );

            if (inDanger(r, c)) {
                if (!bot.aiTarget || inDanger(bot.aiTarget.r, bot.aiTarget.c)) {
                    for (const d of DIRS) {
                        const nr = r + d.dr;
                        const nc = c + d.dc;
                        if (!isTileSolidForFighter(nr, nc, bot)) {
                            bot.aiTarget = { r: nr, c: nc };
                            if (!inDanger(nr, nc)) break;
                        }
                    }
                }
            } else if (bot.aiThink <= 0) {
                bot.aiThink = 0.32;
                const nearBrick = DIRS.some(d => grid[r + d.dr]?.[c + d.dc] === TILE.BRICK);
                const nearFoe = fighters.some(f => f !== bot && f.alive && f.team !== bot.team &&
                    Math.hypot(f.x - bot.x, f.y - bot.y) < TILE_SIZE * 2.5
                ) || monsters.some(m => m.alive && Math.hypot(m.x - bot.x, m.y - bot.y) < TILE_SIZE * 2.5);

                if ((nearBrick || nearFoe) && bot.aiBombCd <= 0 && bot.activeBombs < bot.maxBombs) {
                    const freeDirs = DIRS.filter(d => !isTileSolidForFighter(r + d.dr, c + d.dc, bot));
                    if (freeDirs.length >= 2) {
                        triggerPlantBomb(bot);
                        bot.aiBombCd = 2.2;
                        const esc = freeDirs[0];
                        bot.aiTarget = { r: r + esc.dr, c: c + esc.dc };
                    }
                } else {
                    const freeDirs = DIRS.filter(d => !isTileSolidForFighter(r + d.dr, c + d.dc, bot) && !inDanger(r + d.dr, c + d.dc));
                    if (freeDirs.length > 0) {
                        const pick = freeDirs[Math.floor(Math.random() * freeDirs.length)];
                        bot.aiTarget = { r: r + pick.dr, c: c + pick.dc };
                    }
                }
            }

            if (bot.aiTarget) {
                const tx = (bot.aiTarget.c + 0.5) * TILE_SIZE;
                const ty = (bot.aiTarget.r + 0.5) * TILE_SIZE;
                if (Math.hypot(tx - bot.x, ty - bot.y) > 2) {
                    moveFighter(bot, tx - bot.x, ty - bot.y, dt);
                } else {
                    bot.isMoving = false;
                }
            }
        }

        function updateMonsters(dt) {
            for (const m of monsters) {
                if (!m.alive) continue;
                if (m.invulnTimer > 0) m.invulnTimer = Math.max(0, m.invulnTimer - dt);

                const nx = m.x + m.dir.dc * m.speed * dt;
                const ny = m.y + m.dir.dr * m.speed * dt;
                const checkR = Math.floor((ny + m.dir.dr * 8) / TILE_SIZE);
                const checkC = Math.floor((nx + m.dir.dc * 8) / TILE_SIZE);

                const canPassBrick = m.type === 'GHOST';
                const blocked =
                    checkR <= 0 || checkR >= ROWS - 1 ||
                    checkC <= 0 || checkC >= COLS - 1 ||
                    grid[checkR][checkC] === TILE.WALL ||
                    (!canPassBrick && grid[checkR][checkC] === TILE.BRICK) ||
                    bombs.some(b => b.r === checkR && b.c === checkC);

                if (!blocked && Math.random() > 0.015) {
                    m.x = nx;
                    m.y = ny;
                } else {
                    const valid = DIRS.filter(d => {
                        const tr = Math.floor(m.y / TILE_SIZE) + d.dr;
                        const tc = Math.floor(m.x / TILE_SIZE) + d.dc;
                        if (tr <= 0 || tr >= ROWS - 1 || tc <= 0 || tc >= COLS - 1) return false;
                        if (grid[tr][tc] === TILE.WALL) return false;
                        if (!canPassBrick && grid[tr][tc] === TILE.BRICK) return false;
                        return true;
                    });
                    if (valid.length > 0) {
                        m.dir = valid[Math.floor(Math.random() * valid.length)];
                    }
                }

                for (const f of fighters) {
                    if (!f.alive) continue;
                    if (Math.hypot(f.x - m.x, f.y - m.y) < 14) {
                        applyHitToFighter(f);
                    }
                }
            }

            if (portalTile && !portalTile.open && monsters.every(m => !m.alive)) {
                portalTile.open = true;
                grid[portalTile.r][portalTile.c] = TILE.EMPTY;
                sfx.powerup();
                floatingNotice = { text: '🌀 PORTAL DA FASE ABERTO!', timer: 2.2 };
            }
        }

        function advanceOrBeatCampaign() {
            if (matchFinished) return;
            const currentLvl = currentRoomData?.campaignLevel || 1;
            if (currentLvl < 20) {
                const nextLvl = currentLvl + 1;
                showMatchOverModal(
                    `FASE ${currentLvl}/20 CONCLUÍDA!`,
                    'PORTAL ALCANÇADO!',
                    `PRÓXIMO MAPA: ${CAMPAIGN_STAGES[nextLvl - 1].title}`,
                    nextLvl
                );
                broadcastMatchEvent({
                    type: 'MATCH_OVER',
                    badge: `FASE ${currentLvl}/20 CONCLUÍDA!`,
                    title: 'PORTAL ALCANÇADO!',
                    subtitle: `PRÓXIMO MAPA: ${CAMPAIGN_STAGES[nextLvl - 1].title}`,
                    nextCampaignLevel: nextLvl
                });
            } else {
                showMatchOverModal(
                    'CAMPANHA 20 FASES ZERADA! 🏆',
                    'HERÓIS LENDÁRIOS!',
                    'VOCÊS DERROTARAM O REI SOMBRA E COMPLETARAM TODOS OS 20 MAPAS!',
                    1
                );
                broadcastMatchEvent({
                    type: 'MATCH_OVER',
                    badge: 'CAMPANHA ZERADA! 🏆',
                    title: 'HERÓIS LENDÁRIOS!',
                    subtitle: 'TODOS OS 20 MAPAS FORAM CONCLUÍDOS!',
                    nextCampaignLevel: 1
                });
            }
        }

        function checkMatchOutcome() {
            if (matchFinished || !currentRoomData) return;
            const mode = currentRoomData.mode || 'CAMPAIGN';
            const aliveFighters = fighters.filter(f => f.alive);

            if (mode === 'CAMPAIGN') {
                if (aliveFighters.length === 0) {
                    showMatchOverModal('FIM DE JOGO', 'MISSÃO FALHOU', 'TODOS OS JOGADORES CAÍRAM! VOLTE À SALA OU TENTE NOVAMENTE.', currentRoomData.campaignLevel || 1);
                }
            } else if (mode === 'COMBAT_2V2') {
                const aliveTeams = new Set(aliveFighters.map(f => f.team));
                if (aliveTeams.size <= 1) {
                    const winningTeam = [...aliveTeams][0];
                    if (winningTeam) {
                        const teamLabel = winningTeam === 1 ? 'TIME A (AZUL)' : 'TIME B (LARANJA)';
                        const winnersNames = fighters.filter(f => f.team === winningTeam).map(f => f.nickname).join(' & ');
                        fighters.filter(f => f.team === winningTeam && !f.isAI).forEach(w => {
                            if (db && !isOfflineFallback && currentRoomCode) {
                                const prevWins = currentRoomData.players?.[w.id]?.wins || 0;
                                db.ref(`rooms/${currentRoomCode}/players/${w.id}/wins`).set(prevWins + 1);
                            }
                        });
                        showMatchOverModal('FIM DO COMBATE 2V2', `🏆 ${teamLabel} VENCEU!`, `DUPLA VENCEDORA: ${winnersNames}`);
                    } else {
                        showMatchOverModal('FIM DO COMBATE 2V2', 'EMPATE EXPLOSIVO!', 'AS DUAS DUPLAS CAÍRAM AO MESMO TEMPO!');
                    }
                }
            } else {
                if (aliveFighters.length <= 1) {
                    const winner = aliveFighters[0];
                    const title = winner ? `🏆 ${winner.nickname} VENCEU!` : 'EMPATE EXPLOSIVO!';
                    const sub = winner ? `COR VENCEDORA: ${winner.skin.name}` : 'NINGUÉM SOBREVIVEU NA ARENA!';
                    if (winner && !winner.isAI && db && !isOfflineFallback && currentRoomCode) {
                        const prevWins = currentRoomData.players?.[winner.id]?.wins || 0;
                        db.ref(`rooms/${currentRoomCode}/players/${winner.id}/wins`).set(prevWins + 1);
                    }
                    showMatchOverModal('FIM DO COMBATE', title, sub);
                }
            }
        }

        let pendingNextCampaignLevel = null;

        function showMatchOverModal(badge, title, subtitle, nextLevel = null) {
            if (matchFinished) return;
            matchFinished = true;
            pendingNextCampaignLevel = nextLevel;
            sfx.win();

            document.getElementById('over-badge').textContent = badge;
            document.getElementById('over-title').textContent = title;
            document.getElementById('over-subtitle').textContent = subtitle;

            const rematchBtn = document.getElementById('btn-rematch-now');
            if (currentRoomData?.mode === 'CAMPAIGN' && nextLevel && nextLevel > (currentRoomData.campaignLevel || 1)) {
                rematchBtn.textContent = `▶ AVANÇAR PARA FASE ${nextLevel}/20`;
            } else {
                rematchBtn.textContent = '🔄 JOGAR NOVAMENTE MESMA SALA';
            }

            document.getElementById('match-over-overlay').classList.remove('hidden');
        }

        function returnToLobbyScreen() {
            stopMatchSyncListeners();
            gameRunning = false;
            matchFinished = false;
            document.getElementById('match-over-overlay').classList.add('hidden');
            showScreen('lobby');
            if (currentRoomData) handleRoomSnapshotUpdate(currentRoomData);
        }

        document.getElementById('btn-back-to-lobby').addEventListener('click', () => {
            sfx.select();
            if (currentRoomData) {
                currentRoomData.status = 'LOBBY';
                if (pendingNextCampaignLevel) currentRoomData.campaignLevel = pendingNextCampaignLevel;
                if (db && !isOfflineFallback && currentRoomCode) {
                    db.ref(`rooms/${currentRoomCode}`).update({
                        status: 'LOBBY',
                        campaignLevel: currentRoomData.campaignLevel || 1
                    });
                } else {
                    returnToLobbyScreen();
                }
            } else {
                returnToLobbyScreen();
            }
        });

        document.getElementById('btn-rematch-now').addEventListener('click', () => {
            sfx.select();
            if (!currentRoomData) return;
            const newSeed = Math.floor(Math.random() * 899999 + 100000);
            if (pendingNextCampaignLevel) currentRoomData.campaignLevel = pendingNextCampaignLevel;
            currentRoomData.seed = newSeed;
            currentRoomData.status = 'PLAYING';

            if (db && !isOfflineFallback && currentRoomCode) {
                db.ref(`rooms/${currentRoomCode}/match`).remove();
                db.ref(`rooms/${currentRoomCode}`).update({
                    seed: newSeed,
                    campaignLevel: currentRoomData.campaignLevel || 1,
                    status: 'PLAYING',
                    updatedAt: Date.now()
                });
                startMatchFromRoom(currentRoomData);
            } else {
                startMatchFromRoom(currentRoomData);
            }
        });

        /**
         * ============================================================================
         * 8. LOOP DE ATUALIZAÇÃO E RENDERIZAÇÃO
         * ============================================================================
         */
        const keys = {};
        let lastDirKey = null;
        let lastEscPress = -Infinity;
        const joy = { x: 0, y: 0, active: false };

        function getKeyboardAxis() {
            const up = keys['ArrowUp'] || keys['KeyW'];
            const down = keys['ArrowDown'] || keys['KeyS'];
            const left = keys['ArrowLeft'] || keys['KeyA'];
            const right = keys['ArrowRight'] || keys['KeyD'];

            if (lastDirKey === 'UP' && up) return { dx: 0, dy: -1 };
            if (lastDirKey === 'DOWN' && down) return { dx: 0, dy: 1 };
            if (lastDirKey === 'LEFT' && left) return { dx: -1, dy: 0 };
            if (lastDirKey === 'RIGHT' && right) return { dx: 1, dy: 0 };

            if (up) return { dx: 0, dy: -1 };
            if (down) return { dx: 0, dy: 1 };
            if (left) return { dx: -1, dy: 0 };
            if (right) return { dx: 1, dy: 0 };
            return { dx: 0, dy: 0 };
        }

        function updateGame(dt) {
            gameClock += dt;

            if (!gameRunning || matchFinished) return;

            if (screenShake > 0) screenShake = Math.max(0, screenShake - dt * 18);
            if (floatingNotice) {
                floatingNotice.timer -= dt;
                if (floatingNotice.timer <= 0) floatingNotice = null;
            }

            matchTimer = Math.max(0, matchTimer - dt);
            if (matchTimer <= 0) {
                showMatchOverModal('TEMPO ESGOTADO!', 'EMPATE NA ARENA', 'VOLTE PARA A SALA PARA INICIAR OUTRO ROUND.');
                return;
            }

            for (const f of fighters) {
                if (f.invulnTimer > 0) f.invulnTimer = Math.max(0, f.invulnTimer - dt);
            }

            if (localFighter && localFighter.alive) {
                let dx = 0;
                let dy = 0;

                if (joy.active && (joy.x !== 0 || joy.y !== 0)) {
                    dx = joy.x;
                    dy = joy.y;
                } else {
                    const kb = getKeyboardAxis();
                    dx = kb.dx;
                    dy = kb.dy;
                }

                moveFighter(localFighter, dx, dy, dt);

                if (db && !isOfflineFallback && currentRoomCode && performance.now() - lastNetSync > 50) {
                    lastNetSync = performance.now();
                    db.ref(`rooms/${currentRoomCode}/match/positions/${currentUser.uid}`).set({
                        uid: currentUser.uid,
                        x: Math.round(localFighter.x),
                        y: Math.round(localFighter.y),
                        dir: localFighter.dir,
                        isMoving: localFighter.isMoving,
                        alive: localFighter.alive,
                        mounted: localFighter.mounted
                    }).catch(() => {});
                }
            }

            for (const f of fighters) {
                if (f.isAI && f.alive) updateBotAI(f, dt);
            }

            if (monsters.length > 0) {
                updateMonsters(dt);
            }

            for (let i = bombs.length - 1; i >= 0; i--) {
                const b = bombs[i];
                b.timer -= dt;
                if (b.timer <= 0) explodeBomb(b);
            }

            for (let i = explosions.length - 1; i >= 0; i--) {
                const exp = explosions[i];
                exp.timer -= dt;

                for (const f of fighters) {
                    if (!f.alive) continue;
                    const fr = Math.floor(f.y / TILE_SIZE);
                    const fc = Math.floor(f.x / TILE_SIZE);
                    if (fr === exp.r && fc === exp.c) {
                        applyHitToFighter(f);
                    }
                }

                for (const m of monsters) {
                    if (!m.alive || m.invulnTimer > 0) continue;
                    const mr = Math.floor(m.y / TILE_SIZE);
                    const mc = Math.floor(m.x / TILE_SIZE);
                    if (mr === exp.r && mc === exp.c) {
                        m.hp -= 1;
                        m.invulnTimer = 0.65;
                        if (m.hp <= 0) m.alive = false;
                    }
                }

                if (exp.timer <= 0) explosions.splice(i, 1);
            }
        }

        function renderGame() {
            if (!gameRunning) return;
            ctx.save();

            // 1. Arena 21x21 (504x504 abaixo do HUD de 36px)
            ctx.save();
            ctx.beginPath();
            ctx.rect(0, HUD_HEIGHT, 504, 504);
            ctx.clip();

            ctx.translate(0, HUD_HEIGHT);

            if (screenShake > 0) {
                ctx.translate(Math.round((Math.random() - 0.5) * screenShake), Math.round((Math.random() - 0.5) * screenShake));
            }

            const st = currentBiome;
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const x = c * TILE_SIZE;
                    const y = r * TILE_SIZE;
                    ctx.fillStyle = (r + c) % 2 === 0 ? st.floorA : st.floorB;
                    ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);

                    if (r > 0 && grid[r - 1][c] !== TILE.EMPTY && grid[r][c] === TILE.EMPTY) {
                        ctx.fillStyle = st.shadow;
                        ctx.fillRect(x, y, TILE_SIZE, 4);
                    }

                    if (grid[r][c] === TILE.WALL) {
                        ctx.fillStyle = st.wallMain;
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = st.wallTop;
                        ctx.fillRect(x, y, TILE_SIZE, 3);
                        ctx.fillRect(x, y, 3, TILE_SIZE);
                        ctx.fillStyle = st.wallDark;
                        ctx.fillRect(x, y + TILE_SIZE - 3, TILE_SIZE, 3);
                        ctx.fillRect(x + TILE_SIZE - 3, y, 3, TILE_SIZE);
                    } else if (grid[r][c] === TILE.BRICK) {
                        ctx.fillStyle = st.mortar;
                        ctx.fillRect(x, y, TILE_SIZE, TILE_SIZE);
                        ctx.fillStyle = st.brickMain;
                        ctx.fillRect(x + 1, y + 1, 10, 10);
                        ctx.fillRect(x + 13, y + 1, 10, 10);
                        ctx.fillRect(x + 1, y + 13, 22, 10);
                        ctx.fillStyle = st.brickLight;
                        ctx.fillRect(x + 1, y + 1, 10, 2);
                        ctx.fillRect(x + 13, y + 1, 10, 2);
                        ctx.fillRect(x + 1, y + 13, 22, 2);
                    }
                }
            }

            if (portalTile && grid[portalTile.r][portalTile.c] === TILE.EMPTY) {
                const px = portalTile.c * TILE_SIZE;
                const py = portalTile.r * TILE_SIZE;
                ctx.fillStyle = portalTile.open
                    ? (Math.floor(gameClock * 8) % 2 === 0 ? '#38bdf8' : '#a855f7')
                    : '#475569';
                ctx.fillRect(px + 3, py + 3, 18, 18);
                ctx.fillStyle = portalTile.open ? '#fef08a' : '#1e293b';
                ctx.fillRect(px + 7, py + 7, 10, 10);
            }

            if (horseEntity && !horseEntity.collected) {
                const hx = (horseEntity.c + 0.5) * TILE_SIZE;
                const hy = (horseEntity.r + 0.5) * TILE_SIZE;
                ctx.strokeStyle = Math.floor(gameClock * 8) % 2 === 0 ? '#fde047' : '#f97316';
                ctx.lineWidth = 1.5;
                ctx.strokeRect(horseEntity.c * TILE_SIZE + 2, horseEntity.r * TILE_SIZE + 2, TILE_SIZE - 4, TILE_SIZE - 4);
                drawUnmountedHorseSprite(ctx, hx, hy, gameClock, 0.9);
            }

            for (const it of items) {
                const x = it.c * TILE_SIZE + 2;
                const y = it.r * TILE_SIZE + 2;
                ctx.fillStyle = Math.floor(gameClock * 8) % 2 === 0 ? '#fde047' : '#f97316';
                ctx.fillRect(x, y, 20, 20);
                ctx.fillStyle = '#0f172a';
                ctx.fillRect(x + 2, y + 2, 16, 16);
                ctx.font = '7px "Press Start 2P"';
                ctx.textAlign = 'center';
                ctx.fillStyle = it.type === 'BOMB' ? '#38bdf8' : (it.type === 'FIRE' ? '#ef4444' : '#4ade80');
                ctx.fillText(it.type === 'BOMB' ? '+B' : (it.type === 'FIRE' ? '+F' : '+V'), x + 10, y + 14);
            }

            for (const b of bombs) {
                const cx = Math.floor((b.c + 0.5) * TILE_SIZE);
                const cy = Math.floor((b.r + 0.5) * TILE_SIZE);
                const r = 8 + Math.floor(Math.sin(gameClock * 11) * 1.2);
                ctx.fillStyle = b.timer < 0.6 && Math.floor(gameClock * 16) % 2 === 0 ? '#ef4444' : '#111827';
                ctx.fillRect(cx - r, cy - r + 1, r * 2, r * 2 - 2);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(cx - r + 3, cy - r + 3, 2, 2);
                ctx.fillStyle = '#fde047';
                ctx.fillRect(cx, cy - r - 2, 3, 3);
            }

            for (const exp of explosions) {
                const x = exp.c * TILE_SIZE;
                const y = exp.r * TILE_SIZE;
                ctx.fillStyle = Math.floor(gameClock * 20) % 2 === 0 ? '#ef4444' : '#f97316';
                ctx.fillRect(x + 1, y + 1, 22, 22);
                ctx.fillStyle = '#fef08a';
                ctx.fillRect(x + 5, y + 5, 14, 14);
            }

            for (const m of monsters) {
                if (!m.alive) continue;
                const mx = Math.floor(m.x);
                const my = Math.floor(m.y);
                const sz = m.isBoss ? 12 : 8;
                ctx.fillStyle = '#141018';
                ctx.fillRect(mx - sz - 1, my - sz - 1, sz * 2 + 2, sz * 2 + 2);
                ctx.fillStyle = m.isBoss ? '#dc2626' : (m.type === 'GHOST' ? '#c084fc' : (m.type === 'PYRO' ? '#f97316' : (m.type === 'KNIGHT' ? '#64748b' : '#22c55e')));
                ctx.fillRect(mx - sz, my - sz, sz * 2, sz * 2);
                ctx.fillStyle = '#ffffff';
                ctx.fillRect(mx - 4, my - 3, 2, 3);
                ctx.fillRect(mx + 2, my - 3, 2, 3);
            }

            const is2v2 = currentRoomData?.mode === 'COMBAT_2V2';
            const sortedFighters = [...fighters].sort((a, b) => a.y - b.y);
            for (const f of sortedFighters) {
                if (!f.alive) continue;
                drawBomberSprite(ctx, f.x, f.y, f.skin, f.dir, f.isMoving ? f.animTime : 0, {
                    scale: 0.92,
                    mounted: f.mounted,
                    invulnBlink: f.invulnTimer > 0
                });

                ctx.font = '6px "Press Start 2P"';
                ctx.textAlign = 'center';
                const labelY = Math.floor(f.y) - (f.mounted ? 23 : 18);
                const prefix = is2v2 ? (f.team === 1 ? 'A•' : 'B•') : '';
                const text = prefix + f.nickname.slice(0, 6);
                ctx.fillStyle = '#000000';
                ctx.fillText(text, Math.floor(f.x) + 1, labelY + 1);
                ctx.fillStyle = f === localFighter ? '#fde047' : (is2v2 ? (f.team === 1 ? '#38bdf8' : '#fb923c') : '#ffffff');
                ctx.fillText(text, Math.floor(f.x), labelY);
            }

            ctx.restore();

            // 2. HUD Superior Fixo (36px)
            drawMatchHud();

            ctx.restore();
        }

        function drawMatchHud() {
            ctx.fillStyle = '#141224';
            ctx.fillRect(0, 0, 504, HUD_HEIGHT);
            ctx.fillStyle = '#f59e0b';
            ctx.fillRect(0, HUD_HEIGHT - 2, 504, 2);

            const mins = Math.floor(matchTimer / 60);
            const secs = Math.floor(matchTimer % 60);
            ctx.fillStyle = '#000000';
            ctx.fillRect(216, 4, 72, 26);
            ctx.strokeStyle = '#fde047';
            ctx.lineWidth = 1.5;
            ctx.strokeRect(216, 4, 72, 26);
            ctx.font = '10px "Press Start 2P"';
            ctx.textAlign = 'center';
            ctx.fillStyle = '#fef08a';
            ctx.fillText(`${mins}:${String(secs).padStart(2, '0')}`, 252, 22);

            if (localFighter) {
                ctx.textAlign = 'left';
                ctx.font = '7px "Press Start 2P"';
                ctx.fillStyle = '#fde047';
                ctx.fillText(`${localFighter.skin.name} ${localFighter.mounted ? '🐴2x' : ''}`, 8, 14);

                ctx.fillStyle = '#4ade80';
                ctx.fillText(
                    `B:${localFighter.maxBombs} F:${localFighter.fireRange} V:${localFighter.speedLevel}`,
                    8,
                    27
                );
            }

            ctx.textAlign = 'right';
            ctx.font = '7px "Press Start 2P"';
            if (currentRoomData?.mode === 'CAMPAIGN') {
                const aliveM = monsters.filter(m => m.alive).length;
                ctx.fillStyle = '#38bdf8';
                ctx.fillText(`FASE ${currentRoomData.campaignLevel || 1}/20`, 496, 14);
                ctx.fillStyle = aliveM === 0 ? '#4ade80' : '#fca5a5';
                ctx.fillText(aliveM === 0 ? 'PORTAL ABERTO!' : `INIMIGOS: ${aliveM}`, 496, 27);
            } else if (currentRoomData?.mode === 'COMBAT_2V2') {
                const aliveA = fighters.filter(f => f.alive && f.team === 1).length;
                const aliveB = fighters.filter(f => f.alive && f.team === 2).length;
                ctx.fillStyle = '#38bdf8';
                ctx.fillText('DUPLAS 2V2', 496, 14);
                ctx.fillStyle = '#e2e8f0';
                ctx.fillText(`TIME A:${aliveA} vs B:${aliveB}`, 496, 27);
            } else {
                const aliveCount = fighters.filter(f => f.alive).length;
                ctx.fillStyle = '#f59e0b';
                ctx.fillText('COMBATE PVP', 496, 14);
                ctx.fillStyle = '#e2e8f0';
                ctx.fillText(`VIVOS: ${aliveCount}/${fighters.length}`, 496, 27);
            }

            if (floatingNotice) {
                ctx.fillStyle = 'rgba(0,0,0,0.82)';
                ctx.fillRect(82, 42, 340, 20);
                ctx.strokeStyle = '#fde047';
                ctx.strokeRect(82, 42, 340, 20);
                ctx.textAlign = 'center';
                ctx.font = '7px "Press Start 2P"';
                ctx.fillStyle = '#fef08a';
                ctx.fillText(floatingNotice.text, 252, 55);
            }
        }

        // --- CONTROLES DE TECLADO (SEM DIAGONAL) ---
        window.addEventListener('keydown', (e) => {
            keys[e.code] = true;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') lastDirKey = 'UP';
            else if (e.code === 'ArrowDown' || e.code === 'KeyS') lastDirKey = 'DOWN';
            else if (e.code === 'ArrowLeft' || e.code === 'KeyA') lastDirKey = 'LEFT';
            else if (e.code === 'ArrowRight' || e.code === 'KeyD') lastDirKey = 'RIGHT';

            if (!gameRunning || matchFinished) return;

            if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
                e.preventDefault();
            }
            if (e.code === 'Space' || e.code === 'KeyZ') {
                triggerPlantBomb(localFighter);
            } else if (e.code === 'Escape') {
                if (performance.now() - lastEscPress < 2000) {
                    lastEscPress = -Infinity;
                    document.getElementById('btn-back-to-lobby').click();
                } else {
                    lastEscPress = performance.now();
                    floatingNotice = { text: 'APERTE ESC DE NOVO PARA VOLTAR À SALA', timer: 2.0 };
                }
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.code] = false;
        });

        // --- JOYSTICK TOUCH DE 4 DIREÇÕES PURAS E ZERO DELAY ---
        (function setupTouchJoystick() {
            const base = document.getElementById('joy-base');
            const knob = document.getElementById('joy-knob');
            const MAX_PULL = 40;
            const DEAD_ZONE = 6;
            let activeTouchId = null;

            const setKnob = (x, y) => {
                knob.style.transform = `translate3d(${x}px, ${y}px, 0)`;
            };

            const processPoint = (clientX, clientY) => {
                const rect = base.getBoundingClientRect();
                const cx = rect.left + rect.width / 2;
                const cy = rect.top + rect.height / 2;
                const rawDx = clientX - cx;
                const rawDy = clientY - cy;
                const dist = Math.hypot(rawDx, rawDy);

                if (dist < DEAD_ZONE) {
                    joy.x = 0;
                    joy.y = 0;
                    setKnob(0, 0);
                    return;
                }

                const pull = Math.min(MAX_PULL, dist);
                if (Math.abs(rawDx) > Math.abs(rawDy)) {
                    const signX = Math.sign(rawDx);
                    joy.x = signX;
                    joy.y = 0;
                    setKnob(signX * pull, 0);
                } else {
                    const signY = Math.sign(rawDy);
                    joy.x = 0;
                    joy.y = signY;
                    setKnob(0, signY * pull);
                }
            };

            const resetJoy = () => {
                activeTouchId = null;
                joy.active = false;
                joy.x = 0;
                joy.y = 0;
                setKnob(0, 0);
                base.classList.remove('active');
            };

            base.addEventListener('touchstart', (e) => {
                e.preventDefault();
                if (activeTouchId !== null) return;
                const t = e.changedTouches[0];
                activeTouchId = t.identifier;
                joy.active = true;
                base.classList.add('active');
                processPoint(t.clientX, t.clientY);
            }, { passive: false });

            base.addEventListener('touchmove', (e) => {
                e.preventDefault();
                for (let i = 0; i < e.changedTouches.length; i++) {
                    const t = e.changedTouches[i];
                    if (t.identifier === activeTouchId) {
                        processPoint(t.clientX, t.clientY);
                        break;
                    }
                }
            }, { passive: false });

            const onTouchEnd = (e) => {
                for (let i = 0; i < e.changedTouches.length; i++) {
                    if (e.changedTouches[i].identifier === activeTouchId) {
                        resetJoy();
                        break;
                    }
                }
            };
            base.addEventListener('touchend', onTouchEnd, { passive: false });
            base.addEventListener('touchcancel', onTouchEnd, { passive: false });
        })();

        // --- Botão vermelho de ataque: resposta imediata ---
        const btnTouchBomb = document.getElementById('btn-touch-bomb');
        btnTouchBomb.addEventListener('touchstart', (e) => {
            e.preventDefault();
            btnTouchBomb.classList.add('pressed');
            triggerPlantBomb(localFighter);
        }, { passive: false });
        ['touchend', 'touchcancel'].forEach(ev =>
            btnTouchBomb.addEventListener(ev, () => btnTouchBomb.classList.remove('pressed'), { passive: false })
        );
        btnTouchBomb.addEventListener('mousedown', (e) => {
            e.preventDefault();
            btnTouchBomb.classList.add('pressed');
            triggerPlantBomb(localFighter);
        });
        window.addEventListener('mouseup', () => btnTouchBomb.classList.remove('pressed'));

        let lastFrame = performance.now();
        function mainLoop(now) {
            const dt = Math.min(0.035, (now - lastFrame) / 1000);
            lastFrame = now;
            updateGame(dt);
            renderGame();
            requestAnimationFrame(mainLoop);
        }
        window.onload = () => requestAnimationFrame(mainLoop);
    </script>
    <script>
        // Remove o selo "Powered by Netlify" (inclusive se for injetado depois)
        (function () {
            const SEL = '#netlify-badge, #netlify-badge-container, a[href*="netlify.com"], div[id*="netlify" i], div[class*="netlify" i], iframe[src*="netlify.com"], [data-netlify-badge]';
            const STYLE_ID = 'no-netlify-badge-style';
            const CSS = SEL + '{display:none!important;visibility:hidden!important;opacity:0!important;pointer-events:none!important;}';

            function clean(doc) {
                try {
                    if (!doc || !doc.body) return;
                    if (!doc.getElementById(STYLE_ID)) {
                        const st = doc.createElement('style');
                        st.id = STYLE_ID;
                        st.textContent = CSS;
                        (doc.head || doc.documentElement).appendChild(st);
                    }
                    doc.querySelectorAll(SEL).forEach(el => el.remove());
                    doc.querySelectorAll('body > *:not(script):not(style)').forEach(el => {
                        const txt = (el.textContent || '').trim();
                        if (txt.length < 60 && /powered\s+by\s+netlify/i.test(txt)) el.remove();
                    });
                } catch (e) { /* ignora */ }
            }

            function start() {
                clean(document);
                new MutationObserver(() => clean(document))
                    .observe(document.documentElement, { childList: true, subtree: true });
            }

            if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
            else start();
        })();
    </script>
</body>
